<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090e"><title>SWISH Stock Check</title><link rel="stylesheet" href="./stock-check.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="./stock-check.js"></script></head>
<body><header><a href="./index.html" class="brand">SWISH <span>STOCK CHECK</span></a><span id="connection">Not connected</span><button id="logout" hidden>Sign out</button></header>
<main><section id="login" class="panel"><h1>Stock check sign in</h1><p>Sign in with an authorized stock-check account. A paid SWISH subscription is not required; the account must be assigned access to the correct SWISH tenant.</p><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in</button><p id="loginError" class="error"></p></form></section>
<section id="inventory" hidden><div class="heading"><div><p class="eyebrow">SHARED SWISH BACKEND</p><h1>Surplus Stock Check</h1><p id="tenantName" class="muted"></p></div><button id="refresh" class="secondary">Refresh</button></div>
<div class="stats"><span id="total">0 items</span><span id="selected">0 selected</span><span id="changed">0 changed</span></div><input id="search" placeholder="Search title or SKU…"><div class="tools"><button id="all" class="secondary">Select all</button><button id="none" class="secondary">Select none</button><button id="review" class="secondary">Review changes</button></div><div id="reviewPanel" class="review" hidden></div><p id="message" role="status"></p><div id="rows"></div><div class="bottom"><button id="save" disabled>Save checked changes</button></div></section></main></body></html>

name: Deploy Capture Station, MyGab TV and Job Diary

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "swish.css"
      - "swish.js"
      - "mygab-tv/**"
      - ".github/workflows/deploy-mygab-tv.yml"
  workflow_dispatch:
    inputs:
      staff_rls_verified:
        description: "Confirm Supabase RLS for jobs and job_actions has been tested to deny anonymous access"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-combined-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Capture Station
        uses: actions/checkout@v4

      - name: Prepare combined Pages site
        run: |
          mkdir -p site/mygab-tv site/job-diary
          cp index.html swish.css swish.js site/
          cp -R mygab-tv/. site/mygab-tv/
          touch site/.nojekyll

      - name: Checkout private Job Diary repository
        uses: actions/checkout@v4
        with:
          repository: troonvinyl-ux/JobDiary
          ref: main
          token: ${{ secrets.JOBDIARY_READ_TOKEN }}
          path: job-diary-source

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: job-diary-source/pnpm-lock.yaml

      - name: Configure Job Diary for its Pages subpath
        working-directory: job-diary-source
        run: |
          node -e "const fs=require('fs');const p='app.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.expo.experiments={...(j.expo.experiments||{}),baseUrl:'/KeenOnCoins_Capture_Station/job-diary'};fs.writeFileSync(p,JSON.stringify(j,null,2)+'\\n')"
          test -f .env || (echo "Job Diary .env is missing; configure the existing public EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY for this build." >&2; exit 1)

      - name: Build Job Diary web portal
        working-directory: job-diary-source
        run: |
          # The private app's lockfile is stale versus package.json. Resolve from package.json in this CI workspace only.
          pnpm install --no-frozen-lockfile
          cd "$GITHUB_WORKSPACE/job-diary-source"
          echo "Expo project directory: $(pwd)"
          node -p '"main=" + require("./package.json").main'
          # The parent Capture Station repository has its own Metro config.
          # Temporarily move it aside so Expo uses the Job Diary project's config context.
          if [ -f "$GITHUB_WORKSPACE/metro.config.js" ]; then
            mv "$GITHUB_WORKSPACE/metro.config.js" "$RUNNER_TEMP/capture-station-metro.config.js"
            trap 'mv "$RUNNER_TEMP/capture-station-metro.config.js" "$GITHUB_WORKSPACE/metro.config.js" 2>/dev/null || true' EXIT
          fi
          node "$GITHUB_WORKSPACE/job-diary-source/node_modules/expo/bin/cli" export --platform web --output-dir dist
          cp -R dist/. ../site/job-diary/
          touch ../site/job-diary/.nojekyll

      - name: Verify expected pages exist
        run: |
          test -s site/index.html
          test -s site/mygab-tv/index.html
          test -s site/job-diary/index.html
          test -s site/job-diary/staff/index.html
          test -s site/job-diary/staff/login/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    if: ${{ vars.STAFF_RLS_VERIFIED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.staff_rls_verified == true) }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy combined site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

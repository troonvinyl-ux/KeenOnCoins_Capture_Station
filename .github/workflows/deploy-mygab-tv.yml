name: Deploy MyGab TV

on:
  push:
    branches: [main]
    paths:
      - "mygab-tv/**"
      - ".github/workflows/deploy-mygab-tv.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-mygab-tv"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload MyGab TV static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./mygab-tv"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090e"><title>SWISH Surplus Stock</title><link rel="stylesheet" href="./stock-list.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="./stock-list.js"></script></head>
<body><header><a class="brand" href="./index.html">SWISH <span>SURPLUS STOCK</span></a><div class="header-actions"><span id="connection">Not connected</span><button id="logout" class="quiet" hidden>Sign out</button></div></header>
<main><section id="login" class="panel"><p class="eyebrow">READ-ONLY INVENTORY</p><h1>Surplus stock list</h1><p class="muted">Sign in with an authorized SWISH account to view product images, titles, SKUs, quantities, prices and listing status. This page does not edit stock or publish to eBay.</p><form id="loginForm"><label>Username / email<input id="username" type="text" autocomplete="username" required placeholder="SWISH login"></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button type="submit" id="signIn">Sign in</button><p id="loginError" class="error" role="alert"></p></form></section>
<section id="catalogue" hidden><div class="heading"><div><p class="eyebrow">SHARED SWISH BACKEND</p><h1>Surplus inventory</h1><p id="tenantName" class="muted"></p></div><button id="refresh" class="secondary">Refresh</button></div><div class="toolbar"><input id="search" type="search" placeholder="Search title or SKU…"><select id="statusFilter" aria-label="Filter by status"><option value="">All statuses</option><option value="draft">Draft / preparation</option><option value="live">Live listings</option><option value="sold">Sold</option></select></div><div class="summary"><span id="count">0 items</span><span id="loadedAt"></span></div><p id="message" role="status"></p><div id="items" class="grid"></div><button id="more" class="secondary more" hidden>Load more</button></section></main></body></html>

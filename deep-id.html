<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SWISH Deep ID Lab</title>
<style>
:root{--bg:#0b0e12;--card:#151a21;--line:#28313c;--text:#f2f5f8;--muted:#9ca8b5;--good:#62d69a;--warn:#f1c75b;--bad:#f27676;--accent:#72a8ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1200px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:15px}
h1,h2,h3{margin:.2em 0 .6em}.muted{color:var(--muted)}.small{font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}.metric{display:flex;flex-direction:column;gap:4px}.metric b{font-size:20px}
label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}input,select,textarea{width:100%;background:#0e1319;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}
textarea{min-height:80px;resize:vertical}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.btn{background:#202832;border:1px solid #35414d;color:var(--text);border-radius:8px;padding:9px 12px;cursor:pointer}.btn:hover{filter:brightness(1.15)}.primary{background:#285b9e;border-color:#407cc9}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.drop{border:2px dashed #3b4855;border-radius:12px;padding:28px;text-align:center;cursor:pointer;background:#10151b}.drop.drag{border-color:var(--accent)}
.hidden{display:none}.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.thumb{position:relative}.thumb img{width:150px;height:150px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:12px 0}.row:first-child{border-top:0}.grow{flex:1}.score{font-size:20px;font-weight:700}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#202832;color:#cbd4dd;font-size:11px;margin:2px}
.bar{height:7px;background:#252d36;border-radius:8px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--accent)}
pre{white-space:pre-wrap;word-break:break-word;background:#0b0f14;border:1px solid var(--line);padding:10px;border-radius:8px;font-size:11px;max-height:420px;overflow:auto}
.status{padding:10px;border-radius:8px;background:#10161d;border:1px solid var(--line)}.status.good{border-color:#2f7654}.status.warn{border-color:#76642f}.status.bad{border-color:#763636}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.top{display:block}.thumb img{width:110px;height:110px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>SWISH Deep ID Lab</h1><div class="muted">Independent identification / re-identification / valuation evidence layer</div></div>
    <div id="auth" class="status">Checking SWISH backendâ¦</div>
  </div>

  <div class="card">
    <h2>1. Coin evidence</h2>
    <div class="two">
      <div>
        <label>Obverse / reverse / edge images</label>
        <div id="drop" class="drop">Tap or drop coin images here<input id="files" class="hidden" type="file" accept="image/*" multiple></div>
        <div id="thumbs" class="thumbs"></div>
      </div>
      <div>
        <div class="two">
          <div><label>Weight (g)</label><input id="weight" type="number" step="0.01" placeholder="e.g. 7.78"></div>
          <div><label>Diameter (mm)</label><input id="diameter" type="number" step="0.1" placeholder="e.g. 23"></div>
        </div>
        <div class="two" style="margin-top:10px">
          <div><label>Thickness (mm)</label><input id="thickness" type="number" step="0.1"></div>
          <div><label>Metal</label><input id="metal" placeholder="silver / gold / bronze / unknown"></div>
        </div>
        <label style="margin-top:10px">Observed legends, symbols, ruler, denomination, notes</label>
        <textarea id="notes" placeholder="Describe only what you can actually see. Example: owl facing right; small letters in right field; 0.57g; approx 9mm"></textarea>
      </div>
    </div>
    <div class="toolbar">
      <button id="run" class="btn primary">RUN DEEP ANALYSIS</button>
      <button id="clear" class="btn">Clear</button>
    </div>
  </div>

  <div id="summary" class="card" style="display:none"></div>
  <div id="candidates" class="card" style="display:none"></div>
  <div id="sources" class="card" style="display:none"></div>
  <div id="valuation" class="card" style="display:none"></div>
  <div id="raw" class="card" style="display:none"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ==========================================================
   SWISH DEEP ID LAB
   - No new database
   - No inventory writes
   - Uses existing SWISH backend only for existing Edge Functions
   - Public catalogue research is read-only
   - Numista private API keys are NEVER placed in this file
   ========================================================== */

const SWISH_BACKEND='https://iwgaqieyoahmcjfziwga.backend.onspace.ai';
const SWISH_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpYXQiOjE3ODkwNjM4MTgsImV4cCI6MjEwNDQyMzgxOCwicmVmIjoiaXdnYXFpZXlvYWhtY2pmeml3Z2EiLCJyb2xlIjoiYW5vbiIsImlzcyI6Im9uc3BhY2UifQ.cioQ38guPLFAbl3x48mUaJcMSxU5IpZn7-H-JhtvXJc';
const sb=window.supabase.createClient(SWISH_BACKEND,SWISH_ANON,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'swish_github_auth'}});

const files=[];
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=v=>Number.isFinite(Number(v))?'Â£'+Number(v).toFixed(2):'â';

async function edge(name,payload={}){
  const {data,error}=await sb.functions.invoke(name,{body:payload});
  if(error) throw new Error(error.message||String(error));
  return data;
}

function show(id,html){$(id).style.display='block';$(id).innerHTML=html}
function hide(id){$(id).style.display='none'}

function renderThumbs(){
  $('thumbs').innerHTML=files.map((f,i)=>`<div class="thumb">
    <img src="${esc(f.url)}"><button class="btn" style="position:absolute;right:3px;top:3px;padding:2px 6px" onclick="removeFile(${i})">Ã</button>
  </div>`).join('');
}
window.removeFile=i=>{URL.revokeObjectURL(files[i].url);files.splice(i,1);renderThumbs()};

function addFiles(list){
  [...list].forEach(f=>{if(f.type.startsWith('image/'))files.push({file:f,url:URL.createObjectURL(f)})});
  renderThumbs();
}
$('drop').onclick=()=>$('files').click();
$('files').onchange=e=>addFiles(e.target.files);
$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('drag')};
$('drop').ondragleave=()=>$('drop').classList.remove('drag');
$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('drag');addFiles(e.dataTransfer.files)};
$('clear').onclick=()=>{files.splice(0).forEach(x=>URL.revokeObjectURL(x.url));renderThumbs();['summary','candidates','sources','valuation','raw'].forEach(hide)};

async function upload(file){
  const path=`deep-id/${Date.now()}_${Math.random().toString(36).slice(2)}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
  const {data,error}=await sb.storage.from('images').upload(path,file,{upsert:true});
  if(error)throw error;
  return sb.storage.from('images').getPublicUrl(path).data.publicUrl;
}

/* ---------- public structured research ---------- */

async function fetchJson(url,opts={}){
  const r=await fetch(url,{...opts,headers:{Accept:'application/json',...(opts.headers||{})}});
  if(!r.ok)throw new Error(`${r.status} ${r.statusText}`);
  return await r.json();
}

async function searchCanoa(query){
  if(!query.trim())return {source:'CANOA',results:[]};
  try{
    const j=await fetchJson('https://canoanumis.org/api/search?q='+encodeURIComponent(query));
    return {source:'CANOA',results:j.results||[]};
  }catch(e){return {source:'CANOA',error:e.message,results:[]}};
}

/* Nomisma reconciliation is a useful independent entity resolver.
   It is deliberately used for text/entity evidence, not as an image classifier. */
async function searchNomisma(query){
  if(!query.trim())return {source:'Nomisma',results:[]};
  try{
    const url='https://nomisma.org/apis/reconcile?query='+encodeURIComponent(query);
    const j=await fetchJson(url);
    return {source:'Nomisma',results:Array.isArray(j)?j:(j.result||j.results||[])};
  }catch(e){
    /* Some deployments expose reconciliation differently; retain a non-fatal source failure. */
    return {source:'Nomisma',error:e.message,results:[]};
  }
}

/* Use CANOA's searchable text fields as a structured second-pass candidate generator.
   It is intentionally conservative: it does not pretend that catalogue text is visual proof. */
async function canoaCoinSearch(query,limit=20){
  if(!query.trim())return [];
  try{
    const j=await fetchJson('https://canoanumis.org/api/coins?q='+encodeURIComponent(query)+'&has_image=1&per_page='+limit);
    return j.results||[];
  }catch(e){return []}
}

/* ---------- evidence helpers ---------- */

function norm(v){return String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function textScore(a,b){
  const aa=new Set(norm(a).split(/\s+/).filter(x=>x.length>2));
  const bb=new Set(norm(b).split(/\s+/).filter(x=>x.length>2));
  if(!aa.size||!bb.size)return 0;
  let hit=0;aa.forEach(x=>{if(bb.has(x))hit++});
  return hit/Math.max(aa.size,bb.size);
}
function numericScore(measured,target,tolerance){
  if(!Number.isFinite(measured)||!Number.isFinite(target)||target<=0)return null;
  const d=Math.abs(measured-target)/target;
  return Math.max(0,1-d/tolerance);
}
function mergeCandidate(map,key,patch){
  if(!map.has(key))map.set(key,{key,evidence:[],score:0,...patch});
  const c=map.get(key);Object.assign(c,patch);
  if(patch.evidence)c.evidence.push(...patch.evidence);
  return c;
}

/* The scoring model is deliberately capped.
   A catalogue match cannot become 95% simply because an LLM guessed it.
   Missing evidence remains missing evidence. */
function rankCandidates(rows,inputs){
  return rows.map(c=>{
    let total=0,weight=0;
    const add=(s,w,label)=>{
      if(s==null||!Number.isFinite(Number(s)))return;
      total+=Math.max(0,Math.min(1,Number(s)))*w;weight+=w;
      c.evidence.push(label+': '+Math.round(Number(s)*100)+'%');
    };
    add(c.textScore,.18,'Text/legend');
    add(c.weightScore,.20,'Weight');
    add(c.diameterScore,.12,'Diameter');
    add(c.materialScore,.08,'Material');
    add(c.catalogStrength,.14,'Catalogue strength');
    add(c.visualSignal,.28,'Visual/model signal');
    c.rawScore=weight?total/weight:0;
    c.confidence=Math.min(.92,c.rawScore*(.72+Math.min(.28,weight)));
    if(weight<.45)c.confidence=Math.min(c.confidence,.59);
    return c;
  }).sort((a,b)=>b.confidence-a.confidence);
}

function confidenceLabel(c){
  if(c<.75)return '<span class="bad">UNRESOLVED / LOW CONFIDENCE</span>';
  if(c<.88)return '<span class="warn">MEDIUM CONFIDENCE â VERIFY</span>';
  return '<span class="good">HIGH CONFIDENCE â STILL VERIFY PHYSICAL COIN</span>';
}

/* ---------- main analysis ---------- */

async function run(){
  if(!files.length && !$('notes').value.trim() && !$('weight').value && !$('diameter').value){
    show('summary','<div class="status bad">Add at least one image or useful physical/text evidence.</div>');return;
  }
  $('run').disabled=true;$('run').textContent='RUNNINGâ¦';
  ['summary','candidates','sources','valuation','raw'].forEach(hide);

  const inputs={
    weight:Number($('weight').value)||null,
    diameter:Number($('diameter').value)||null,
    thickness:Number($('thickness').value)||null,
    metal:$('metal').value.trim(),
    notes:$('notes').value.trim()
  };
  const uploaded=[];
  let baseline=null,market=null;

  try{
    /* Upload only to the existing SWISH storage bucket. */
    for(const x of files){try{uploaded.push(await upload(x.file))}catch(e){}}

    /* Existing SWISH ID is a signal, NOT the final answer. */
    try{
      baseline=await edge('swish-identify',{
        images:uploaded,
        existingImageUrls:uploaded,
        specialistId:'coins',
        knownAttributes:inputs,
        deepLab:true,
        doNotAutoAccept:true
      });
    }catch(e){
      try{
        baseline=await edge('identify',{images:uploaded,knownAttributes:inputs,specialistId:'coins',deepLab:true});
      }catch(_){}
    }

    /* Extract human-searchable terms from the baseline without trusting its confidence. */
    const bi=baseline?.identification||baseline?.result||{};
    const candidates0=baseline?.candidates||((baseline?.identification)?[baseline.identification]:[]);
    const queryTerms=[
      inputs.notes,
      bi.title,bi.canonicalTitle,bi.denomination,bi.mint,bi.authority,bi.ruler,
      ...candidates0.slice(0,5).flatMap(x=>[x.title,x.denomination,x.mint,x.authority,x.ruler,x.description])
    ].filter(Boolean).join(' ');

    const canoaSearch=await searchCanoa(queryTerms.slice(0,500));
    const nomisma=await searchNomisma((bi.ruler||bi.authority||inputs.notes||'').slice(0,150));
    const canoaCoins=await canoaCoinSearch(queryTerms.slice(0,300),30);

    const map=new Map();

    /* Baseline candidates */
    candidates0.slice(0,8).forEach((x,i)=>{
      const key=norm(x.numistaTypeId||x.catalogueNumber||x.title||('baseline-'+i));
      const c=mergeCandidate(map,key,{
        title:x.title||x.canonicalTitle||'SWISH candidate',
        reference:x.numistaTypeId?`Numista N#${x.numistaTypeId}`:(x.catalogueNumber||''),
        description:x.description||'',
        visualSignal:Number(x.confidence),
        textScore:textScore(queryTerms,x.title+' '+x.description),
        evidence:['Existing SWISH engine candidate; not independently verified']
      });
      c.baseline=x;
    });

    /* CANOA structured candidates */
    canoaCoins.slice(0,20).forEach((x,i)=>{
      const key=norm(x.uri||x.slug||x.ocre_id||x.label||('c-'+i));
      const c=mergeCandidate(map,key,{
        title:x.label||x.pref_label||'CANOA coin type',
        reference:x.ocre_id||x.uri||'',
        mint:x.mint||'',
        authority:x.authority||'',
        denomination:x.denomination||'',
        material:x.material||'',
        dateFrom:x.date_from,dateTo:x.date_to,
        catalogStrength:Math.min(1,Math.log10((Number(x.specimen_count)||0)+1)/4),
        textScore:textScore(queryTerms,[x.label,x.ocre_id,x.mint,x.authority,x.denomination].join(' ')),
        visualSignal:null,
        evidence:[`CANOA structured record; ${x.specimen_count||0} linked specimens`]
      });
      c.weightScore=null;c.diameterScore=null;
      if(x.image)c.evidence.push('CANOA type has an image reference');
    });

    /* Merge rough metrology from baseline attributes if available. */
    const all=Array.from(map.values());
    all.forEach(c=>{
      const attrs=c.baseline?.attributes||c.baseline?.metrology||{};
      const cw=Number(attrs.weight||attrs.weight_g||c.baseline?.weight)||null;
      const cd=Number(attrs.diameter||attrs.diameter_mm||c.baseline?.diameter)||null;
      c.weightScore=numericScore(inputs.weight,cw,.18);
      c.diameterScore=numericScore(inputs.diameter,cd,.15);
      if(inputs.metal)c.materialScore=textScore(inputs.metal,c.material||attrs.metal||'');
      if(!c.catalogStrength)c.catalogStrength=.25;
      if(c.visualSignal==null)c.visualSignal=.05; /* no visual proof from catalogue text */
    });

    const ranked=rankCandidates(all,inputs);

    /* Existing valuation function is intentionally fed only after identification evidence exists.
       It remains a market-data source, not an identification authority. */
    if(ranked.length){
      const top=ranked[0];
      try{
        market=await edge('swish-market-value',{
          title:top.title,
          specialistId:'coins',
          attributes:{
            weight:inputs.weight,diameter:inputs.diameter,metal:inputs.metal,
            deep_candidate:top.title,deep_reference:top.reference,
            deep_confidence:top.confidence
          },
          identificationConfidence:top.confidence,
          identificationTier:top.confidence>=.88?'high':top.confidence>=.75?'medium':'low',
          numistaTypeId:top.baseline?.numistaTypeId||null,
          numistaMatchScore:top.baseline?.numistaMatchScore||0,
          numistaMatchTier:top.baseline?.numistaMatchTier||'unverified',
          applyToItem:false,
          deepLab:true
        });
      }catch(_){}
    }

    renderSummary(ranked,inputs,baseline);
    renderCandidates(ranked.slice(0,12));
    renderSources(canoaSearch,nomisma,canoaCoins);
    renderValuation(market,ranked[0],inputs);
    show('raw',`<h2>Research trace</h2><div class="muted small">This is deliberately visible so an optimistic result can be audited instead of hidden.</div><pre>${esc(JSON.stringify({inputs,uploaded,baseline,canoaSearch,nomisma,canoaCoins,ranked,market},null,2))}</pre>`);
  }catch(e){
    show('summary',`<div class="status bad"><b>Deep analysis failed:</b> ${esc(e.message)}</div>`);
  }finally{
    $('run').disabled=false;$('run').textContent='RUN DEEP ANALYSIS';
  }
}

function renderSummary(ranked,inputs,baseline){
  if(!ranked.length){show('summary','<div class="status warn"><b>UNRESOLVED.</b> No defensible catalogue candidate was produced. This is an acceptable result.</div>');return}
  const top=ranked[0],second=ranked[1],gap=second?top.confidence-second.confidence:top.confidence;
  const hardCap=top.confidence<.75;
  show('summary',`<h2>Deep conclusion</h2>
    <div class="status ${hardCap?'warn':'good'}">
      <div class="small">BEST CURRENT CANDIDATE</div><h3>${esc(top.title)}</h3>
      <div class="score">${Math.round(top.confidence*100)}% evidence confidence</div>
      <p>${confidenceLabel(top.confidence)}</p>
      <p class="muted">Candidate gap: ${Math.round(gap*100)} points Â· ${top.evidence.length} evidence observations.</p>
      ${hardCap?'<p><b>The system is refusing to call this identified.</b> More evidence is required.</p>':''}
    </div>
    <div class="grid" style="margin-top:10px">
      <div class="card metric"><span class="muted">Weight</span><b>${inputs.weight?inputs.weight+' g':'â'}</b></div>
      <div class="card metric"><span class="muted">Diameter</span><b>${inputs.diameter?inputs.diameter+' mm':'â'}</b></div>
      <div class="card metric"><span class="muted">Images</span><b>${files.length}</b></div>
      <div class="card metric"><span class="muted">SWISH baseline</span><b>${baseline?'Used as one signal':'Unavailable'}</b></div>
    </div>`);
}

function renderCandidates(rows){
  if(!rows.length){hide('candidates');return}
  show('candidates','<h2>Ranked candidates</h2>'+rows.map((c,i)=>`
    <div class="row"><div class="grow">
      <div><span class="pill">#${i+1}</span><b>${esc(c.title)}</b></div>
      <div class="muted small">${esc(c.reference||'No catalogue reference')} ${c.mint?'Â· '+esc(c.mint):''} ${c.denomination?'Â· '+esc(c.denomination):''}</div>
      <div class="bar"><i style="width:${Math.round(c.confidence*100)}%"></i></div>
      <div class="small muted">${c.evidence.slice(0,7).map(esc).join(' Â· ')}</div>
    </div><div style="text-align:right"><div class="score">${Math.round(c.confidence*100)}%</div></div></div>`).join(''));
}

function renderSources(canoa,nomisma,coins){
  show('sources',`<h2>Independent sources consulted</h2>
    <div class="row"><div class="grow"><b>CANOA</b><div class="muted">Open ancient-world catalogue / structured records</div></div><div>${canoa.results?.length||0} search hits</div></div>
    <div class="row"><div class="grow"><b>Nomisma.org</b><div class="muted">Linked numismatic entities / reconciliation</div></div><div>${Array.isArray(nomisma.results)?nomisma.results.length:0} results</div></div>
    <div class="row"><div class="grow"><b>CANOA coin records</b><div class="muted">Structured type candidates, not visual proof</div></div><div>${coins.length}</div></div>
    <p class="small muted">Public catalogue data is evidence. It is not automatically proof that the physical coin in the photograph is that type.</p>`);
}

function renderValuation(v,top,inputs){
  const x=v?.valuation||v?.result||v||{};
  const low=Number(x.valuationLow??x.valuation_low);
  const mid=Number(x.valuationMid??x.valuation_mid??x.recommendedListingPrice??x.recommended_listing_price);
  const high=Number(x.valuationHigh??x.valuation_high);
  const usable=top&&top.confidence>=.75&&Number.isFinite(mid)&&mid>0;
  show('valuation',`<h2>Deep valuation</h2>
    <div class="status ${usable?'good':'warn'}">
      ${usable?`<div class="grid"><div class="metric"><span class="muted">Low</span><b>${money(low)}</b></div><div class="metric"><span class="muted">Mid</span><b>${money(mid)}</b></div><div class="metric"><span class="muted">High</span><b>${money(high)}</b></div><div class="metric"><span class="muted">Confidence</span><b>${esc(x.valuationConfidence||x.valuation_confidence||'â')}</b></div></div>
      <p class="small">This valuation is not allowed to override a weak identification. If identification confidence falls below the evidence threshold, the value is deliberately suppressed.</p>`
      :`<b>NO DEFENSIBLE VALUE YET.</b><p class="muted">The lab will not turn an uncertain coin identification into a confident price.</p>`}
    </div>`);
}

$('run').onclick=run;

(async()=>{
  try{
    const {data:{user}}=await sb.auth.getUser();
    $('auth').textContent=user?'SWISH backend connected Â· signed in':'SWISH backend reachable Â· sign-in required for private Edge Functions';
    $('auth').className='status '+(user?'good':'warn');
  }catch(e){$('auth').textContent='Backend check failed';$('auth').className='status bad'}
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08080b">
  <title>Coin Flipper — SWISH</title>
  <meta name="description" content="SWISH seller intelligence workspace powered by the existing OnSpace backend.">
  <style>
    :root{color-scheme:dark;--bg:#0b0f16;--panel:#121925;--panel2:#182232;--line:#293548;--text:#f2f5fa;--muted:#9ba8ba;--accent:#e6b94f;--good:#38c98b;--bad:#f16b73;--blue:#70a8ff;--radius:15px}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(ellipse at top,#172234 0,#0b0f16 56%);color:var(--text);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .app{min-height:100vh;padding:0 0 78px}
    .main{max-width:1440px;margin:0 auto;padding:22px clamp(12px,3vw,34px) 42px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:4px 0 18px;border-bottom:1px solid var(--line)}
    .brand{font-size:25px;font-weight:850;letter-spacing:-.6px;color:var(--accent)}
    .status,.muted,.small{color:var(--muted)}.status{font-size:12px;margin-top:3px}
    .topright{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}
    .niche-label{font-size:12px;color:var(--muted)}
    .niche-select{width:auto;min-width:110px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--text)}
    .conn{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
    .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#778398}.dot.good{background:var(--good)}
    .nav{display:flex;gap:7px;overflow:auto;padding:14px 0 18px;scrollbar-width:thin}
    .nav button,.bottom button{border:1px solid transparent;background:transparent;color:var(--muted);padding:10px 13px;border-radius:10px;white-space:nowrap}
    .nav button.active,.bottom button.active{color:var(--text);background:#283449;border-color:#3a4a62}
    #view{min-height:300px}
    .card{background:linear-gradient(145deg,rgba(23,32,47,.98),rgba(17,24,36,.98));border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;min-width:0;box-shadow:0 12px 28px rgba(0,0,0,.12)}
    .card .card{background:rgba(8,13,21,.3);box-shadow:none}
    h1,h2,h3,h4{line-height:1.2;margin:0 0 12px}h2{font-size:22px}h3{font-size:17px}p{margin:8px 0 12px}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:14px}
    .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .metric{margin:0;padding:15px;display:flex;flex-direction:column;gap:5px}.metric b{font-size:25px}
    .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .btn{border:1px solid #3b4960;border-radius:10px;background:#202c3e;color:var(--text);padding:9px 12px;min-height:38px}
    .btn:hover{filter:brightness(1.13)}.btn.primary{background:var(--accent);color:#1a1a18;border-color:var(--accent);font-weight:750}
    .btn.good{background:#123d32;border-color:#226d54}.btn.bad{background:#48232a;border-color:#74333b}
    input,select,textarea{width:100%;min-width:0;border:1px solid #35445a;background:#0c121c;color:var(--text);border-radius:9px;padding:10px 11px;outline:none}
    input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 2px #70a8ff20}
    input[type=file]{padding:9px}textarea{min-height:100px;resize:vertical}
    label{display:block;margin:0 0 6px}
    .row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
    .row:last-child{border-bottom:0}.grow{flex:1;min-width:0}.title{font-weight:700;overflow-wrap:anywhere}.price{font-weight:750;color:var(--accent);white-space:nowrap}
    .tag{display:inline-block;border:1px solid #3b4960;border-radius:999px;padding:3px 8px;margin:5px 5px 0 0;color:var(--muted);font-size:11px}
    .tabs{display:flex;gap:6px;overflow:auto;margin:12px 0}.tabs button{background:#111925;border:1px solid var(--line);border-radius:9px;padding:8px 12px;color:var(--muted);white-space:nowrap}.tabs button.active{background:#29364a;color:var(--text)}
    .empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed #3a4658;border-radius:12px}
    .error,.success{padding:12px 14px;border-radius:10px;overflow-wrap:anywhere;margin:10px 0}.error{background:#3c1e27;border:1px solid #74343f;color:#ffd7dc}.success{background:#12352d;border:1px solid #28664f;color:#d7fff0}
    .pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px;overflow:auto;background:#080c12;border:1px solid var(--line);border-radius:9px;padding:12px;font-size:12px}
    .table-wrap{overflow:auto;max-width:100%}.tbl{border-collapse:collapse;width:100%;font-size:13px;min-width:620px}.tbl th,.tbl td{text-align:left;border-bottom:1px solid var(--line);padding:10px 9px;vertical-align:top}.tbl th{color:var(--muted);font-weight:600}.right{text-align:right!important}
    .thumbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:9px}.thumbgrid img{display:block;width:100%;height:120px;object-fit:contain;background:#080c12;border:1px solid var(--line);border-radius:9px}
    .drop{display:block;text-align:center;padding:28px;border:1px dashed #52627a;border-radius:12px;background:#0d1420;cursor:pointer}.hidden{display:none}
    .login{max-width:540px;margin:9vh auto}.spinner{width:22px;height:22px;border:3px solid #4b5a70;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 9px}@keyframes spin{to{transform:rotate(360deg)}}
    .toast{position:fixed;z-index:99;bottom:88px;left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);padding:12px 16px;background:#26354a;border:1px solid #52627a;border-radius:12px;box-shadow:0 10px 35px #0008}.toast.error{background:#48232a}
    .bottom{display:none}
    @media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.four{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding-top:12px}.top{align-items:flex-start}.topright{max-width:58%}.conn{width:100%;justify-content:flex-end}.nav{padding-top:10px}}
    @media(max-width:600px){.main{padding:12px 10px 28px}.top{gap:8px}.brand{font-size:21px}.status{max-width:190px}.topright{gap:6px}.niche-label{display:none}.niche-select{min-width:95px;padding:8px}.nav{display:none}.bottom{display:block;position:fixed;z-index:20;bottom:0;left:0;right:0;padding:7px 6px calc(7px + env(safe-area-inset-bottom));background:#0c111aee;backdrop-filter:blur(16px);border-top:1px solid var(--line)}.bottomin{display:flex;gap:2px;overflow:auto;justify-content:space-between}.bottom button{font-size:11px;padding:9px 7px;flex:1}.card{padding:14px;margin-bottom:10px}.two{grid-template-columns:1fr}.grid{gap:8px}.metric{padding:12px}.metric b{font-size:22px}.row{align-items:flex-start}.toolbar .btn{flex:0 0 auto}.login{margin:7vh 0}.toast{bottom:86px}}

    /* Coin Flipper visual system — inspired by the supplied reference screens */
    :root{color-scheme:dark;--bg:#08080b;--panel:#111116;--panel2:#17171d;--line:#25252d;--text:#f5f0df;--muted:#77747d;--accent:#ffcf3f;--good:#38c98b;--bad:#f16b73;--blue:#4f8df7;--radius:27px}
    body{background:#08080b;color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .app{padding-bottom:108px}.main{max-width:1000px;padding:20px clamp(14px,4vw,38px) 42px}
    .top{padding:16px 0 20px;border-bottom:1px solid #30260b;align-items:center}
    .brand{font-size:clamp(21px,4vw,30px);font-weight:900;letter-spacing:2.5px;color:var(--accent);text-transform:uppercase}
    .brand:before{content:'◉';display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;margin-right:13px;border:2px solid #71580c;border-radius:50%;background:#211900;color:var(--accent);font-size:23px;vertical-align:middle;letter-spacing:0}
    .status{color:#82714a;text-transform:uppercase;letter-spacing:2px;font-size:10px}
    .conn{display:none}.topright{max-width:45%}.niche-select{background:#211900;border:1px solid #70560b;color:var(--accent);border-radius:18px;font-weight:700}
    .nav{border-bottom:1px solid #2e250d;padding:14px 0 17px;gap:10px}
    .nav button{color:#88764b;font-weight:700;border-radius:18px;padding:12px 16px}
    .nav button.active{background:#211900;color:var(--accent);border-color:#6e550c}
    .card{background:#111116;border:1px solid #282830;border-radius:28px;box-shadow:none;padding:20px}
    .card .card{background:#111116;border-color:#272730}
    h1,h2,h3,h4{color:#f6f0df}h2{font-size:clamp(22px,4vw,30px);font-weight:850}h3{font-size:18px}
    .btn{border:1px solid #6c530b;border-radius:15px;background:#211900;color:var(--accent);padding:10px 15px;font-weight:750}
    .btn.primary{background:var(--accent);color:#171000;border-color:var(--accent)}
    input,select,textarea{background:#111116;border:1px solid #292930;border-radius:18px;padding:14px;color:var(--text)}
    .row{background:#111116;border:1px solid #272730;border-left:5px solid var(--accent);border-radius:27px;padding:18px;margin:12px 0;align-items:center}
    .title{font-size:17px;font-weight:750}.tag{background:#292315;border-color:#3c3217;color:var(--accent);font-size:12px;padding:4px 10px}
    .tabs{gap:8px;padding-bottom:5px}.tabs button{border-radius:24px;background:#111116;border:1px solid #292930;padding:11px 17px;font-weight:700}.tabs button.active{background:#211900;color:var(--accent);border-color:#8b6b10}
    .grid{gap:12px}.metric{border-radius:22px}.metric b{color:var(--accent)}
    .thumbgrid img{height:112px;border-radius:18px;background:#17171d;border:0}
    .bottom{display:block;position:fixed;z-index:30;bottom:0;left:0;right:0;padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:#111116f5;backdrop-filter:blur(18px);border-top:1px solid #25252d}
    .bottomin{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;max-width:850px;margin:auto}
    .bottom button{font-size:12px;padding:12px 5px 10px;min-height:64px;border-radius:16px;color:#686873;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:700}
    .bottom button:before{font-size:22px;line-height:1.1}.bottom button[data-go="dashboard"]:before{content:'◉'}.bottom button[data-go="identify"]:before{content:'▦'}.bottom button[data-go="inventory"]:before{content:'▣'}.bottom button[data-go="ebay"]:before{content:'▤'}
    .bottom button.active{background:#192d4b;color:#4f8df7;border-color:transparent}
    .empty{border-color:#3b321a;color:#958b71}.pre{background:#08080b;border-color:#292930}
    @media(max-width:600px){.main{padding:10px 15px 24px}.top{padding:10px 0 17px}.brand{letter-spacing:1.5px}.brand:before{width:38px;height:38px;margin-right:10px}.topright{max-width:43%}.niche-select{min-width:88px;padding:8px 10px}.nav{display:flex;overflow:auto;margin:0 -15px;padding:12px 15px 16px}.nav button{font-size:12px;padding:10px 13px}.card{padding:16px;margin-bottom:12px}.bottom button{font-size:11px}.app{padding-bottom:100px}.two{grid-template-columns:1fr}}


    .home-hero{min-height:500px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:38px 10px 52px}
    .hero-mark{width:170px;height:170px;display:grid;place-items:center;color:var(--accent);font-size:90px;position:relative;margin-bottom:16px}
    .hero-mark:before{content:'';position:absolute;inset:22px;border:6px solid var(--accent);border-top-color:transparent;border-bottom-color:transparent;border-radius:50%}
    .hero-title{font-size:clamp(30px,6vw,54px);font-weight:950;letter-spacing:5px;color:var(--accent)}
    .hero-sub{margin-top:22px;color:#9a8658;letter-spacing:3px;font-size:clamp(10px,2vw,15px)}
    .pro-pill{margin-top:25px;border-radius:999px;padding:8px 28px;background:var(--accent);color:#171000;font-weight:900;letter-spacing:3px}
    .home-tools{margin:0 0 24px}.section-kicker{font-weight:900;letter-spacing:2px;color:#8d7948;margin:0 0 16px}
    .tool-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
    .tool-tile{min-height:150px;border:1px solid #3b300e;background:#100f09;border-radius:28px;color:#f2e8c8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}
    .tool-tile span{width:70px;height:70px;display:grid;place-items:center;border-radius:22px;background:#2b2100;color:var(--accent);font-size:34px;font-weight:900}
    .tool-tile b{font-size:14px}.tool-tile:active{transform:scale(.98)}
    @media(max-width:600px){.home-hero{min-height:430px;padding:25px 4px 40px}.hero-mark{width:150px;height:150px;font-size:78px}.hero-title{letter-spacing:3px}.hero-sub{letter-spacing:2px;line-height:1.8}.tool-grid{gap:10px}.tool-tile{min-height:130px;border-radius:24px}.tool-tile span{width:58px;height:58px;font-size:28px}.tool-tile b{font-size:12px}}

  </style>
</head>
<body>
  <div id="app"><main class="main"><div class="card"><div class="brand">SWISH</div><p class="muted">Loading your existing SWISH workspace…</p><div class="spinner"></div></div></main></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script defer src="./app.js?v=20261022-fullswish"></script>
</body>
</html>

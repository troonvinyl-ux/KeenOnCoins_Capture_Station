<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090f">
<title>SWISH — KeenOnCoins</title>
<style>
:root{--bg:#07090f;--panel:#101219;--line:#252832;--text:#eef5ff;--muted:#777f91;--accent:#4f8ff7;--good:#39d39a;--warn:#ffbf69;--bad:#ff6b7a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.main{width:min(900px,100%);margin:auto;padding:18px 16px 100px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:16px}.brand{font-size:29px;font-weight:900}.brand span{color:var(--accent)}.status{font-size:11px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:6px}.dot.good{background:var(--good)}.nav{display:flex;gap:7px;overflow:auto;padding-bottom:10px}.nav button{flex:0 0 auto;border:1px solid var(--line);background:#11141b;color:#9aa3b4;border-radius:999px;padding:9px 13px}.nav button.active{background:#17345f;color:#72a8ff;border-color:#376fc4}.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:17px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.metric b{font-size:28px;display:block;margin:5px 0}.muted{color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);background:#181c26;color:#fff;border-radius:13px;padding:10px 14px}.primary{background:var(--accent);border-color:var(--accent);color:#06101f}.good{background:#113a2d;border-color:#1c7250}.bad{background:#3a151b;border-color:#6f252e}.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #20232d}.row:last-child{border-bottom:0}.grow{flex:1;min-width:0}.thumb{width:62px;height:62px;object-fit:cover;border-radius:14px;background:#191c25}.title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{font-weight:900}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{flex:1;min-width:180px}input,select,textarea{background:#0b0e15;color:#fff;border:1px solid var(--line);border-radius:12px;padding:11px}textarea{min-height:120px;width:100%}.empty{text-align:center;padding:28px;color:var(--muted);border:1px dashed #334055;border-radius:15px}.error{color:#ff9aa5;background:#35151d;padding:10px;border-radius:12px}.success{color:#6de1b8;background:#123c31;padding:10px;border-radius:12px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#090b11ee;border-top:1px solid var(--line);padding:8px}.bottomin{width:min(900px,100%);margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.bottom button{background:none;border:0;color:#777f91;padding:8px;font-size:11px}.bottom button.active{color:#72a8ff}.hidden{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.main{padding-left:12px;padding-right:12px}.brand{font-size:25px}}
</style>
</head>
<body>
<div class="app"><main class="main">
<div class="top"><div><div class="brand">S<span>WISH</span></div><div class="status">KeenOnCoins seller intelligence</div></div><div id="connection"><span class="dot"></span>Connecting…</div></div>
<div class="nav" id="nav"></div>
<div id="view"></div>
</main></div>
<div class="bottom"><div class="bottomin" id="bottom"></div></div>

<script>
/* EXISTING SWISH / ONSPACE CONNECTION — DO NOT REPLACE */
const CFG={
  url:'https://iwgaqieyoahmcjfziwga.backend.onspace.ai',
  anon:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpYXQiOjE3ODkwNjM4MTgsImV4cCI6MjEwNDQyMzgxOCwicmVmIjoiaXdnYXFpZXlvYWhtY2pmeml3Z2EiLCJyb2xlIjoiYW5vbiIsImlzcyI6Im9uc3BhY2UifQ.cioQ38guPLFAbl3x48mUaJcMSxU5IpZn7-H-JhtvXJc'
};
const FN={
 browse:'swish-ebay-browse',list:'swish-ebay-list',taxonomy:'swish-ebay-taxonomy',
 messages:'swish-ebay-messages',orders:'swish-ebay-orders',postOrder:'swish-ebay-post-order',
 sync:'swish-ebay-sync',identify:'swish-identify',islamic:'swish-islamic-identify',
 imageDownload:'swish-image-download',reprice:'swish-reprice',decompose:'swish-decompose',
 marketValue:'swish-market-value',listGenerate:'swish-list-generate'
};
const state={page:'dashboard',token:localStorage.getItem('swish_access_token')||'',refresh:localStorage.getItem('swish_refresh_token')||'',tenant:null,connector:null,cache:{}};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

async function rest(table,params={}){
  const u=new URL(CFG.url+'/rest/v1/'+table);
  Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
  const r=await fetch(u,{headers:{apikey:CFG.anon,Authorization:'Bearer '+(state.token||CFG.anon)}});
  const d=await r.json().catch(()=>null);
  if(!r.ok)throw new Error(d?.message||d?.error_description||'Backend request failed');
  return d;
}
async function fn(name,body={}){
  const r=await fetch(CFG.url+'/functions/v1/'+name,{method:'POST',headers:{'Content-Type':'application/json',apikey:CFG.anon,Authorization:'Bearer '+(state.token||CFG.anon)},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>null);
  if(!r.ok)throw new Error(d?.error||d?.message||'SWISH function failed');
  return d;
}
async function loadTenant(){
  const rows=await rest('tenants',{select:'id,name,slug,subscription_tier,settings,created_at',order:'created_at.asc',limit:1});
  state.tenant=Array.isArray(rows)?rows[0]:null;
  if(!state.tenant)throw new Error('No SWISH tenant found for this account.');
  state.connector=await rest('marketplace_connectors',{select:'status,access_token_expires_at,seller_account_id,last_sync_at,can_publish,selected_fulfillment_policy_id,selected_return_policy_id',tenant_id:'eq.'+state.tenant.id,marketplace_id:'eq.ebay',limit:1}).then(x=>x?.[0]||null).catch(()=>null);
}
async function signIn(email,password){
  const r=await fetch(CFG.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json',apikey:CFG.anon},body:JSON.stringify({email,password})});
  const d=await r.json();
  if(!r.ok)throw new Error(d.error_description||d.msg||d.error||'Sign in failed');
  state.token=d.access_token;state.refresh=d.refresh_token||'';
  localStorage.setItem('swish_access_token',state.token);
  if(state.refresh)localStorage.setItem('swish_refresh_token',state.refresh);
  await loadTenant(); render();
}
function connection(ok,text){$('#connection').innerHTML='<span class="dot '+(ok?'good':'')+'"></span>'+esc(text)}
function nav(){
  const items=[['dashboard','⌂ Home'],['listings','▣ Listings'],['inventory','◫ Inventory'],['orders','▤ Orders'],['intelligence','✦ Intelligence'],['scan','◉ Identify'],['more','••• More']];
  $('#nav').innerHTML=items.map(x=>`<button class="${state.page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');
  $('#bottom').innerHTML=items.slice(0,4).map(x=>`<button class="${state.page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');
}
function go(p){state.page=p;render()}
function render(){
 nav();
 const v=$('#view');
 if(state.page==='dashboard')v.innerHTML=dashboard();
 else if(state.page==='inventory'){
   v.innerHTML=inventory();
   setTimeout(()=>loadInventory(),0);
 }
 else if(state.page==='listings')v.innerHTML=listings();
 else if(state.page==='orders')v.innerHTML=orders();
 else if(state.page==='intelligence')v.innerHTML=intelligence();
 else if(state.page==='scan')v.innerHTML=scan();
 else v.innerHTML=more();
}
function dashboard(){
 const c=state.connector||{};
 return `<div class="card"><h2>SWISH Seller Hub</h2><p class="muted">Connected directly to your existing OnSpace SWISH backend.</p><div class="grid"><div class="card metric"><span class="muted">eBay</span><b>${esc(c.status||'Connected')}</b><span class="muted">${esc(c.seller_account_id||'Existing account')}</span></div><div class="card metric"><span class="muted">Publishing</span><b>${c.can_publish?'READY':'CHECK'}</b><span class="muted">Existing eBay connector</span></div></div></div>
 <div class="card"><h3>Next actions</h3><div class="toolbar"><button class="btn primary" onclick="go('inventory')">Inventory</button><button class="btn" onclick="go('scan')">Identify a coin</button><button class="btn" onclick="go('intelligence')">SWISH Intelligence</button></div></div>`;
}
function inventory(){return `<div class="card"><h2>Inventory</h2><div class="toolbar"><input id="invq" placeholder="Search your SWISH inventory" onkeydown="if(event.key==='Enter')loadInventory()"><button class="btn primary" onclick="loadInventory()">Search</button></div><div id="inv"><div class="empty">Loading inventory…</div></div></div>`}
async function loadInventory(){
 const box=$('#inv');if(!box)return;
 try{
  const q=($('#invq')?.value||'').trim();
  const rows=await rest('items',{select:'id,title,sku,condition,estimated_value,commercial_score,status,created_at',tenant_id:'eq.'+state.tenant.id,...(q?{title:'ilike.*'+q+'*'}:{}),order:'created_at.desc',limit:100});
  box.innerHTML=rows.length?rows.map(x=>`<div class="row"><div class="grow"><div class="title">${esc(x.title||'Untitled item')}</div><div class="muted">${esc(x.sku||x.id)} · ${esc(x.condition||'Condition unknown')}</div></div><div class="price">${x.estimated_value?'£'+Number(x.estimated_value).toFixed(2):'—'}</div></div>`).join(''):'<div class="empty">No inventory found.</div>';
 }catch(e){box.innerHTML='<div class="error">'+esc(e.message)+'</div>'}
}
function listings(){return `<div class="card"><h2>eBay Listings</h2><p class="muted">Uses the existing SWISH eBay listing function and existing connector.</p><div class="toolbar"><button class="btn primary" onclick="loadListings()">Load live listings</button></div><div id="lst"><div class="empty">Press Load live listings.</div></div></div>`}
async function loadListings(){
 const box=$('#lst');if(!box)return;
 try{
  const d=await fn(FN.browse,{route:'list',tenantId:state.tenant.id});
  const rows=d?.listings||d?.items||d?.data||[];
  box.innerHTML=rows.length?rows.map(x=>`<div class="row"><div class="grow"><div class="title">${esc(x.title||x.item?.title||'Untitled')}</div><div class="muted">${esc(x.status||'eBay listing')} · ${esc(x.itemId||x.item_id||'')}</div></div><div class="price">${x.price?'£'+x.price:''}</div></div>`).join(''):'<div class="empty">No live listings returned.</div>';
 }catch(e){box.innerHTML='<div class="error">'+esc(e.message)+'</div>'}
}
function orders(){return `<div class="card"><h2>Orders</h2><p class="muted">Existing SWISH eBay Orders Edge Function.</p><button class="btn primary" onclick="loadOrders()">Load orders</button><div id="ord" class="section"></div></div>`}
async function loadOrders(){
 try{const d=await fn(FN.orders,{route:'list',tenantId:state.tenant.id});const rows=d?.orders||d?.data||[];$('#ord').innerHTML=rows.length?rows.map(x=>`<div class="row"><div class="grow"><div class="title">${esc(x.orderId||x.order_id||'Order')}</div><div class="muted">${esc(x.status||'')}</div></div><div>${esc(x.total||'')}</div></div>`).join(''):'<div class="empty">No orders returned.</div>'}catch(e){$('#ord').innerHTML='<div class="error">'+esc(e.message)+'</div>'}
}
function intelligence(){return `<div class="card"><h2>SWISH Intelligence</h2><p class="muted">Uses the existing identification, Islamic identification and valuation Edge Functions.</p><div class="toolbar"><button class="btn primary" onclick="identifyTest()">Identify / value selected inventory</button></div><div id="intel"></div></div>`}
async function identifyTest(){
 const b=$('#intel');b.innerHTML='<div class="empty">Select an inventory item first from Inventory. This panel is wired to the existing SWISH engines.</div>';
}
function scan(){return `<div class="card"><h2>Coin Identification</h2><p class="muted">Existing SWISH identification engine — no new database or API setup.</p><input id="scanId" placeholder="Existing SWISH item ID"><div class="toolbar" style="margin-top:10px"><button class="btn primary" onclick="runIdentify()">Analyse coin</button><button class="btn" onclick="runIslamic()">Islamic / countermark</button><button class="btn" onclick="runValue()">Re-value</button></div><div id="scanOut"></div></div>`}
async function runIdentify(){return runEngine(FN.identify)}
async function runIslamic(){return runEngine(FN.islamic)}
async function runValue(){return runEngine(FN.marketValue)}
async function runEngine(name){
 const out=$('#scanOut'),id=$('#scanId')?.value.trim();
 if(!id){out.innerHTML='<div class="error">Enter an existing SWISH item ID.</div>';return}
 out.innerHTML='<div class="empty">Running '+esc(name)+'…</div>';
 try{const item=(await rest('items',{select:'*',id:'eq.'+id,limit:1}))[0];if(!item)throw new Error('Item not found');const payload={tenantId:state.tenant.id,itemId:id,item,images:item.images||item.media||[]};const d=await fn(name,payload);out.innerHTML='<div class="success"><b>Engine complete</b><pre style="white-space:pre-wrap">'+esc(JSON.stringify(d,null,2))+'</pre></div>'}catch(e){out.innerHTML='<div class="error">'+esc(e.message)+'</div>'}
}
function more(){return `<div class="card"><h2>SWISH</h2><p class="muted">Existing seller functions remain on the OnSpace backend.</p><div class="toolbar"><button class="btn" onclick="go('listings')">Listings</button><button class="btn" onclick="go('orders')">Orders</button><button class="btn" onclick="go('scan')">Identification</button><button class="btn" onclick="go('intelligence')">Valuation / Intelligence</button></div></div>`}
async function bootstrap(){
 try{
  await loadTenant();
  connection(true,(state.connector?.status||'Connected')+' · eBay');
  render();
 }catch(e){
  connection(false,'Backend connection needs sign-in');
  $('#view').innerHTML=`<div class="card"><h2>SWISH Sign in</h2><p class="muted">The existing OnSpace backend is already configured. No API key entry is required.</p><input id="email" type="email" placeholder="Email"><br><br><input id="password" type="password" placeholder="Password"><br><br><button class="btn primary" onclick="doLogin()">Sign in</button><div id="loginError"></div></div>`;
 }
}
async function doLogin(){try{await signIn($('#email').value,$('#password').value)}catch(e){$('#loginError').innerHTML='<div class="error" style="margin-top:10px">'+esc(e.message)+'</div>'}}
bootstrap();
</script>
</body>
</html>

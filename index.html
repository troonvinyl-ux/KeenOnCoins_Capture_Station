<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SWISH — eBay Intelligence Hub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#070b11;--side:#0a1018;--p:#101823;--p2:#141f2d;--line:#263547;--txt:#f3f6fa;--muted:#8ea0b5;--yellow:#ffd21a;--green:#3cdb91;--red:#ff6473;--blue:#55a8ff;--purple:#ae83ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:245px;background:var(--side);border-right:1px solid var(--line);padding:16px 10px;overflow:auto}.logo{font-size:24px;font-weight:900;letter-spacing:.08em;padding:8px 12px 18px}.logo i{color:var(--yellow);font-style:normal}.sec{color:#61738a;font-size:10px;text-transform:uppercase;letter-spacing:.14em;padding:15px 12px 6px}.nav{width:100%;border:0;background:transparent;color:#aebdd0;text-align:left;padding:10px 12px;border-radius:10px;margin:1px 0;display:flex;gap:10px;align-items:center}.nav:hover,.nav.on{background:#172232;color:white}.nav.on{box-shadow:inset 3px 0 var(--yellow)}.badge{margin-left:auto;background:#213249;border-radius:20px;padding:2px 6px;font-size:10px}.main{margin-left:245px;width:calc(100% - 245px);padding:22px;max-width:1800px}.top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:18px}.h1{font-size:27px;font-weight:850}.sub{color:var(--muted);font-size:12px;margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--p);color:#fff;border-radius:9px;padding:9px 12px}.btn.primary{background:var(--yellow);border-color:var(--yellow);color:#111;font-weight:800}.btn.green{border-color:#276f4d;color:#77efb4}.btn.red{border-color:#6d2e38;color:#ff9aa4}.grid{display:grid;gap:13px}.g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:var(--p);border:1px solid var(--line);border-radius:15px;padding:15px}.metric{font-size:25px;font-weight:850;margin-top:7px}.label{color:var(--muted);font-size:11px}.green{color:var(--green)}.yellow{color:var(--yellow)}.red{color:var(--red)}.blue{color:var(--blue)}.purple{color:var(--purple)}.banner{border:1px solid #604e16;background:#1b180d;border-radius:13px;padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:13px}.banner.good{background:#0b2118;border-color:#215f43}.banner.bad{background:#240e14;border-color:#6b2d38}.grow{flex:1}.small{font-size:11px;color:var(--muted)}h2{font-size:15px;margin:0 0 11px}h3{font-size:13px;margin:0 0 8px}.table{width:100%;border-collapse:collapse}.table th,.table td{border-bottom:1px solid #1d2a3a;padding:10px 8px;text-align:left;font-size:12px}.table th{color:var(--muted);font-weight:600}.pill{display:inline-block;background:#1b2a3d;border-radius:999px;padding:4px 7px;font-size:10px}.list{display:grid;gap:8px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.input{background:#09111a;border:1px solid var(--line);border-radius:9px;color:white;padding:10px;width:100%}.textarea{min-height:110px;resize:vertical}.field{display:grid;gap:5px;margin-bottom:9px}.field label{font-size:11px;color:var(--muted)}.empty{padding:35px;text-align:center;color:var(--muted)}.tabs{display:flex;gap:5px;overflow:auto;margin-bottom:12px}.tab{white-space:nowrap}.hero{background:linear-gradient(135deg,#151f2e,#0b1119);border:1px solid var(--line);border-radius:17px;padding:20px}.hero .big{font-size:28px;font-weight:850}.progress{height:7px;background:#1a2736;border-radius:10px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--yellow)}.notice{padding:9px 0;border-bottom:1px solid #1c2939}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}.modal>div{background:var(--p);border:1px solid var(--line);border-radius:17px;max-width:850px;width:100%;max-height:90vh;overflow:auto;padding:20px}.hide{display:none}.chart{height:150px;display:flex;align-items:end;gap:5px}.bar{flex:1;background:#31516e;border-radius:4px 4px 0 0;min-height:8px}.kpi{display:flex;align-items:center;gap:10px}.dot{width:9px;height:9px;border-radius:50%;background:var(--green)}@media(max-width:1000px){.side{width:70px}.logo{font-size:14px;text-align:center}.nav span,.sec{display:none}.nav{justify-content:center}.main{margin-left:70px;width:calc(100% - 70px)}.g5,.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}@media(max-width:650px){.main{padding:12px}.g5,.g4,.g3,.g2{grid-template-columns:1fr}.top{flex-direction:column}}
</style></head><body><div id="root"></div>
<script>
const CONFIG={"url": "https://iwgaqieyoahmcjfziwga.backend.onspace.ai", "key": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpYXQiOjE3ODkwNjM4MTgsImV4cCI6MjEwNDQyMzgxOCwicmVmIjoiaXdnYXFpZXlvYWhtY2pmeml3Z2EiLCJyb2xlIjoiYW5vbiIsImlzcyI6Im9uc3BhY2UifQ.cioQ38guPLFAbl3x48mUaJcMSxU5IpZn7-H-JhtvXJc"};
const sb=(CONFIG.url&&CONFIG.key&&window.supabase)?supabase.createClient(CONFIG.url,CONFIG.key):null;
const e=(x)=>String(x??'');
const money=(n)=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(Number(n)||0);
const esc=(x)=>e(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NAV=[
 ['hub','▦','Seller Hub'],['listings','▤','Listings'],['orders','▣','Orders'],['messages','✉','Messages'],['offers','◇','Offers'],
 ['returns','↩','Returns'],['cases','!','Cases'],['finances','£','Finances'],['analytics','◒','Analytics'],['notifications','●','Notifications'],
 ['account','◎','Account'],['inventory','◈','Inventory'],['scanner','⌾','CoinSnap Scan'],['agents','✦','Intelligence Agents'],
 ['decompose','⌁','Decomposition Search'],['calculations','∑','Custom Calculations'],['create','＋','Listing Editor'],['import','⇩','eBay Import'],['settings','⚙','Settings']
];
let state={page:location.hash.slice(1)||'hub',rows:{},toast:'',modal:null};
function go(p){state.page=p;location.hash=p;render()}
addEventListener('hashchange',()=>{state.page=location.hash.slice(1)||'hub';render()});
async function q(table,opts='*',extra=''){if(!sb)throw Error('Supabase configuration is unavailable');let r=await sb.from(table).select(opts).limit(100);if(extra)r=await r; if(r.error)throw r.error;return r.data||[]}
async function fn(name,body){if(!sb)throw Error('Supabase configuration is unavailable');const {data,error}=await sb.functions.invoke(name,{body});if(error)throw error;return data}
function shell(body){document.querySelector('#root').innerHTML=`<aside class="side"><div class="logo">SW<span>I</span>SH</div>${NAV.map((n,i)=>(i===0?'<div class="sec">eBay Seller Hub</div>':i===11?'<div class="sec">SWISH Intelligence</div>':'')+`<button class="nav ${state.page===n[0]?'on':''}" onclick="go('${n[0]}')"><b>${n[1]}</b><span>${n[2]}</span></button>`).join('')}</aside><main class="main">${body}</main>`}
function top(title,sub,actions=''){return `<div class="top"><div><div class="h1">${title}</div><div class="sub">${sub||''}</div></div><div class="actions">${actions}</div></div>`}
function metric(label,value,cls=''){return `<div class="card"><div class="label">${label}</div><div class="metric ${cls}">${value}</div></div>`}
function btn(t,fnc,cls=''){return `<button class="btn ${cls}" onclick="${fnc}">${t}</button>`}
function toast(t){state.toast=t;render();setTimeout(()=>{state.toast='';render()},2500)}
async function tablePage(title,table,cols,actions=''){let rows=[];let err='';try{rows=await q(table)}catch(x){err=x.message||String(x)}return top(title,'Live SWISH data · '+table,actions)+ (err?`<div class="banner bad">${esc(err)}</div>`:'')+`<div class="card">${rows.length?`<table class="table"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'<div class="empty">No records returned yet.</div>'}</div>`}
async function hub(){let l=[],o=[],m=[],s=[];try{[l,o,m,s]=await Promise.all([q('listings'),q('orders'),q('ebay_messages'),q('sales')])}catch(_){}let active=l.filter(x=>['active','published','live'].includes(String(x.status).toLowerCase())).length;let drafts=l.filter(x=>String(x.status).toLowerCase().includes('draft')).length;let unread=m.filter(x=>x.is_read===false||x.isRead===false).length;let sales=s.reduce((a,x)=>a+Number(x.net_revenue??x.sale_price??0),0);
return top('eBay Seller Hub','SWISH aims to make Seller Hub unnecessary for normal operations.',btn('Refresh','render()','')+btn('＋ New listing',"go('create')",'primary'))+
`<div class="banner good"><div class="dot"></div><div class="grow"><b>SWISH online</b><div class="small">Existing backend · existing eBay Edge Functions · no second database.</div></div><span class="pill">CONNECTED</span></div>
<div class="grid g5">${metric('Active listings',active,'green')}${metric('Drafts',drafts,'yellow')}${metric('Orders',o.length,'blue')}${metric('Unread messages',unread,'red')}${metric('Revenue / recorded sales',money(sales),'green')}</div>
<div class="grid g3" style="margin-top:13px"><div class="hero"><div class="label">SWISH Intelligence</div><div class="big">What should I do next?</div><p class="sub">Agents can prioritise listings, identify underpriced inventory, detect opportunities and run custom calculations.</p>${btn('Open agents',"go('agents')",'primary')}</div>
<div class="card"><h2>Seller Hub control centre</h2>${['Listings','Orders','Messages','Offers','Returns / Cases','Finances / Analytics'].map((x,i)=>`<div class="notice row between"><span>${x}</span>${btn('Open',`go('${['listings','orders','messages','offers','returns','analytics'][i]}')`)}</div>`).join('')}</div>
<div class="card"><h2>Notifications</h2><div class="notice"><b>${unread}</b> unread eBay messages</div><div class="notice">Agent alerts are kept separate from eBay notifications</div><div class="notice">Sync and OAuth health belongs here</div>${btn('Open notifications',"go('notifications')",'')}</div></div>
<div class="grid g2" style="margin-top:13px"><div class="card"><h2>Prediction queue</h2><div class="small">Examples the intelligence layer can calculate:</div><div class="notice">Listings likely to need repricing</div><div class="notice">Items with strong commercial potential</div><div class="notice">Job lots likely to contain target coins</div><div class="notice">Auctions ending inside a chosen time window</div></div><div class="card"><h2>Design models</h2><div class="notice"><b>CoinSnap model</b><br><span class="small">Camera-first identification scan and visual result presentation.</span></div><div class="notice"><b>Vendoo model</b><br><span class="small">Central inventory, listing, sales, delist and workflow control.</span></div><div class="notice"><b>SWISH intelligence</b><br><span class="small">Prediction agents + decomposition + custom calculations.</span></div></div></div>`}
function notifications(){return top('Notifications','One notification centre for eBay events, sync problems and SWISH intelligence.',btn('Refresh','render()'))+`<div class="grid g2"><div class="card"><h2>eBay</h2><div class="notice"><b>Messages</b><div class="small">Unread buyer communications</div></div><div class="notice"><b>Orders</b><div class="small">New / changed orders</div></div><div class="notice"><b>Offers</b><div class="small">Incoming offers and negotiation events</div></div><div class="notice"><b>Returns & cases</b><div class="small">Post-order events requiring attention</div></div></div><div class="card"><h2>SWISH</h2><div class="notice"><b>Identification</b><div class="small">Low-confidence or conflicting coin attributions</div></div><div class="notice"><b>Valuation</b><div class="small">Valuation confidence / evidence warnings</div></div><div class="notice"><b>Agents</b><div class="small">New opportunity, auction or repricing signals</div></div><div class="notice"><b>System</b><div class="small">OAuth, sync and API errors</div></div></div></div>`}
function agents(){return top('Intelligence Agents','Serious prediction and research agents — controlled by explicit instructions.',btn('＋ New agent',"agentModal()",'primary'))+
`<div class="grid g3"><div class="card"><h2>Opportunity Agent</h2><p class="small">Finds potentially mispriced inventory and acquisition opportunities.</p>${btn('Configure',"agentModal('opportunity')")}</div><div class="card"><h2>Listing Agent</h2><p class="small">Scores title, item specifics, images, price and conversion signals.</p>${btn('Configure',"agentModal('listing')")}</div><div class="card"><h2>Coin Agent</h2><p class="small">Combines scan evidence, catalogue references and market evidence without inventing certainty.</p>${btn('Configure',"agentModal('coin')")}</div><div class="card"><h2>Auction Watch Agent</h2><p class="small">Runs searches against your chosen keywords, geography and ending window.</p>${btn('Configure',"agentModal('auction')")}</div><div class="card"><h2>Decomposition Agent</h2><p class="small">Breaks job lots / collections into likely components and estimates opportunity.</p>${btn('Configure',"agentModal('decompose')")}</div><div class="card"><h2>Prediction Agent</h2><p class="small">Learns from actual SWISH outcomes, not arbitrary optimistic scores.</p>${btn('Configure',"agentModal('prediction')")}</div></div>`}
function decompose(){return top('Decomposition Search','Turn a natural-language acquisition instruction into a structured search.',btn('Run search',"runDecomp()",'primary'))+
`<div class="card"><div class="field"><label>Instruction</label><textarea id="dq" class="input textarea">Look for joblots that include keyword "" in Scotland ending in the next 24 hours</textarea></div><div class="grid g3"><div class="field"><label>Marketplace</label><select id="dm" class="input"><option>eBay</option></select></div><div class="field"><label>Geography</label><input id="dg" class="input" value="Scotland"></div><div class="field"><label>Ending window</label><input id="dw" class="input" value="24 hours"></div></div><div class="small">Examples: “search for coin collections containing the keywords obol, stater, litra” · “find job lots in Scotland ending tomorrow” · “find silver lots with dirham in the title”.</div></div><div id="decompResult" class="card" style="margin-top:13px"><div class="empty">No search executed yet.</div></div>`}
async function runDecomp(){let qv=document.getElementById('dq')?.value||'';let box=document.getElementById('decompResult');box.innerHTML='<div class="empty">Parsing instruction…</div>';let result;try{result=await fn('swish-ebay-browse',{instruction:qv,query:qv,mode:'opportunity_search'})}catch(x){result={localInterpretation:true,error:x.message||String(x)}}let kws=(qv.match(/(?:obol|stater|litra|dirham|drachm|tetradrachm|joblot|collection|silver|gold|ancient)/gi)||[]);box.innerHTML=`<h2>Decomposition plan</h2><div class="grid g3"><div><div class="label">Detected keywords</div><b>${kws.length?[...new Set(kws.map(x=>x.toLowerCase()))].join(', '):'None yet'}</b></div><div><div class="label">Geography</div><b>${esc(document.getElementById('dg')?.value)}</b></div><div><div class="label">Time condition</div><b>${esc(document.getElementById('dw')?.value)}</b></div></div><div class="notice"><b>Agent action:</b> parse → search → decompose candidate lots → identify possible components → estimate acquisition value → flag evidence → present opportunities for human approval.</div>${result?.error?`<div class="banner bad">The existing browse function did not accept this request: ${esc(result.error)}. The structured plan is still available.</div>`:`<pre style="white-space:pre-wrap;max-height:280px;overflow:auto">${esc(JSON.stringify(result,null,2))}</pre>`}` }
function calculations(){return top('Custom Calculations','Create your own formulas and use them as reusable intelligence features.',btn('＋ Add calculation',"calcModal()",'primary'))+
`<div class="grid g3"><div class="card"><h2>Quick-sale value</h2><div class="small">Example configurable model</div><div class="notice">metal value × recovery factor + scarcity adjustment</div>${btn('Edit',"calcModal()")}</div><div class="card"><h2>Lot opportunity</h2><div class="small">Example</div><div class="notice">(estimated resale − purchase − fees − risk allowance) ÷ purchase</div>${btn('Edit',"calcModal()")}</div><div class="card"><h2>Commercial score</h2><div class="small">Example</div><div class="notice">confidence × demand × margin × sell-through</div>${btn('Edit',"calcModal()")}</div></div><div class="card" style="margin-top:13px"><h2>Formula engine</h2><div class="small">Variables can later be bound to listing, coin, market and sale fields.</div><table class="table"><tr><th>Variable</th><th>Meaning</th></tr><tr><td>weight_g</td><td>Measured coin/item weight</td></tr><tr><td>metal_price_g</td><td>Current configured metal reference</td></tr><tr><td>confidence</td><td>Identification confidence</td></tr><tr><td>purchase_price</td><td>Acquisition cost</td></tr><tr><td>estimated_resale</td><td>Evidence-backed resale estimate</td></tr><tr><td>fees</td><td>Configured eBay / transaction costs</td></tr></table></div>`}
function calcModal(){state.modal=`<h2>Custom calculation</h2><div class="field"><label>Name</label><input id="cn" class="input" value="My calculation"></div><div class="field"><label>Formula</label><textarea id="cf" class="input textarea">estimated_resale - purchase_price - fees</textarea></div><div class="field"><label>Output type</label><select id="ct" class="input"><option>Currency</option><option>Percentage</option><option>Score</option><option>Number</option></select></div><div class="actions">${btn('Cancel','closeModal()')}${btn('Save calculation','saveCalc()','primary')}</div>`;render()}
function saveCalc(){let n=document.getElementById('cn')?.value,f=document.getElementById('cf')?.value;localStorage.setItem('swish_calc_'+Date.now(),JSON.stringify({name:n,formula:f}));closeModal();toast('Calculation saved locally');}
function agentModal(){state.modal=`<h2>New intelligence instruction</h2><div class="field"><label>Instruction</label><textarea id="ai" class="input textarea">Find coin collections containing the keywords obol, stater, litra and ending within the next 24 hours. Decompose promising lots and estimate potential resale after fees.</textarea></div><div class="field"><label>Run frequency</label><select class="input"><option>Manual</option><option>Hourly</option><option>Daily</option></select></div><div class="small">The instruction is stored as an agent definition; privileged eBay actions remain server-side.</div><div class="actions" style="margin-top:12px">${btn('Cancel','closeModal()')}${btn('Create agent','saveAgent()','primary')}</div>`;render()}
function saveAgent(){let v=document.getElementById('ai')?.value||'';localStorage.setItem('swish_agent_'+Date.now(),v);closeModal();toast('Agent instruction saved');}
function closeModal(){state.modal=null;render()}
function editor(){return top('eBay Listing Editor','Structured like an eBay listing: title, description, category, condition, item specifics, media, pricing, delivery and publishing controls.',btn('Save draft',"toast('Draft structure saved')",'primary'))+
`<div class="grid g2"><div class="card"><h2>Core listing</h2>${[['Title','title',''],['Category','category','Coins'],['Condition','condition','Used'],['Price','price','0.00']].map(a=>`<div class="field"><label>${a[0]}</label><input class="input" id="${a[1]}" value="${a[2]}"></div>`).join('')}<div class="field"><label>Description</label><textarea class="input textarea" id="description"></textarea></div></div><div class="card"><h2>Item specifics</h2>${['Brand / issuer','Country / region','Period','Year','Denomination','Composition','Metal','Diameter','Weight','Certification','Grade','Reference / catalogue number'].map((x,i)=>`<div class="field"><label>${x}</label><input class="input" id="sp${i}"></div>`).join('')}</div></div><div class="card" style="margin-top:13px"><h2>Media & delivery</h2><div class="grid g3"><div><div class="drop">Add images</div></div><div><div class="field"><label>Delivery method</label><select class="input"><option>Simple delivery</option></select></div><div class="field"><label>Dispatch time</label><input class="input" value="2 days"></div></div><div><div class="field"><label>Publishing</label><select class="input"><option>Draft — human approval</option><option>Publish via eBay</option></select></div>${btn('Validate eBay structure',"toast('Listing validation queued')",'green')}</div></div></div>`}
async function render(){
 let p=state.page, body='';
 try{
 if(p==='hub')body=await hub(); else if(p==='notifications')body=notifications(); else if(p==='agents')body=agents(); else if(p==='decompose')body=decompose(); else if(p==='calculations')body=calculations(); else if(p==='create')body=editor();
 else if(p==='scanner')body=top('CoinSnap Scan','Camera-first coin identification experience. Capture obverse + reverse, then send to SWISH identification.'); 
 else if(p==='listings')body=await tablePage('Listings','listings',['id','title','status','price','marketplace_id'],btn('New listing',"go('create')",'primary'));
 else if(p==='orders')body=await tablePage('Orders','orders',['id','status','fulfilment_status','created_at']);
 else if(p==='messages')body=await tablePage('Messages','ebay_messages',['id','subject','buyer_username','is_read','created_at']);
 else if(p==='offers')body=await tablePage('Offers','ebay_offers',['id','offer_type','offer_amount','status','expires_at']);
 else if(p==='returns')body=await tablePage('Returns','ebay_returns',['id','status','reason','created_at']);
 else if(p==='cases')body=await tablePage('Cases','ebay_cases',['id','status','reason','created_at']);
 else if(p==='finances')body=await tablePage('Finances','ebay_financials',['id','amount','transaction_type','transaction_date']);
 else if(p==='analytics')body=await tablePage('Analytics','sales',['id','sale_price','net_revenue','sold_at']);
 else if(p==='account')body=await tablePage('eBay Account','marketplace_connectors',['id','status','seller_account_id','last_sync']);
 else if(p==='inventory')body=await tablePage('Inventory','inventory',['id','title','status','created_at']);
 else if(p==='import')body=top('eBay Import','Import/sync remains server-side. The original SWISH eBay sync Edge Function is preserved.',btn('Run sync',"runSync()",'primary'))+'<div class="card"><div class="empty">Use the existing swish-ebay-sync function rather than duplicating OAuth credentials in the browser.</div></div>';
 else if(p==='settings')body=top('Settings','SWISH configuration and intelligence controls.')+'<div class="grid g2"><div class="card"><h2>Backend</h2><div class="notice">Existing Supabase/OnSpace backend</div><div class="notice">Existing eBay Edge Functions</div><div class="notice">No new database</div></div><div class="card"><h2>Safety</h2><div class="notice">Secrets remain server-side</div><div class="notice">Human approval before publishing</div><div class="notice">Simple delivery by default</div></div></div>';
 else body=top('SWISH','Page not found')+btn('Seller Hub',"go('hub')");
 }catch(x){body=top('SWISH','Error')+`<div class="banner bad">${esc(x.message||x)}</div>`}
 shell(body);if(state.toast)document.body.insertAdjacentHTML('beforeend',`<div class="modal" style="position:fixed;inset:auto 20px 20px auto;background:none;z-index:100"><div style="background:#18263a;border:1px solid #34455b;border-radius:10px;padding:12px 16px;width:auto;max-width:400px">${esc(state.toast)}</div></div>`);if(state.modal)document.body.insertAdjacentHTML('beforeend',`<div class="modal"><div>${state.modal}</div></div>`);
}
async function runSync(){try{await fn('swish-ebay-sync',{action:'sync'});toast('eBay sync requested')}catch(x){toast('Sync request: '+(x.message||x))}}
render();
</script></body></html>

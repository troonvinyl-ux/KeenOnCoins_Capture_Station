<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>SWISH — Seller Intelligence</title>
<style>
:root{
 --bg:#07111f;--panel:#0d1a2c;--panel2:#10223a;--panel3:#132945;--line:#1d3552;
 --text:#eef5ff;--muted:#91a5bd;--accent:#5b8cff;--accent2:#7ca5ff;
 --good:#39d39a;--warn:#ffbf69;--bad:#ff6b7a;--purple:#a47cff;
 --radius:16px;--shadow:0 12px 40px rgba(0,0,0,.22)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{overflow-x:hidden}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.app{min-height:100vh;display:flex}
.sidebar{position:fixed;z-index:20;left:0;top:0;bottom:0;width:258px;background:#081525;border-right:1px solid var(--line);padding:16px 12px;overflow:auto}
.brand{font-size:25px;font-weight:900;letter-spacing:.4px;padding:7px 10px 18px}
.brand span{color:var(--accent2)}
.workspace{font-size:10px;color:#66809f;text-transform:uppercase;letter-spacing:1.2px;padding:0 10px 12px}
.navgroup{margin-top:16px}
.navgroup-title{font-size:10px;color:#5f7691;text-transform:uppercase;letter-spacing:1.2px;margin:0 10px 6px;font-weight:800}
.nav{width:100%;border:0;background:transparent;color:#9db0c8;text-align:left;padding:10px 11px;border-radius:11px;margin:2px 0;font-size:13px;display:flex;align-items:center;gap:10px}
.nav:hover,.nav.active{background:#142845;color:#fff}
.nav .ico{width:18px;text-align:center;opacity:.9}
.nav .badge{margin-left:auto;background:#233b5c;color:#bcd0ea;border-radius:999px;padding:2px 6px;font-size:9px}
.main{margin-left:258px;width:calc(100% - 258px);padding:20px;max-width:1700px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}
.heading h1{font-size:28px;line-height:1.05;margin:0 0 5px}
.heading p{margin:0;color:var(--muted);font-size:12px}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.connection{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);padding:9px 12px;border-radius:12px;color:var(--muted);font-size:11px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.dot.good{background:var(--good)}
.btn{border:1px solid var(--line);background:#132a49;color:#fff;padding:9px 12px;border-radius:10px;font-weight:750;font-size:12px}
.btn:hover{background:#1a3961}
.btn.primary{background:var(--accent);border-color:var(--accent)}
.btn.good{background:#123e32;border-color:#246b55}
.btn.danger{background:#421b24;border-color:#71313d}
.btn.ghost{background:transparent}
.btn.small{padding:6px 9px;font-size:11px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:1.3fr .7fr;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.metric .label{color:var(--muted);font-size:11px}
.metric .value{font-size:28px;font-weight:900;margin:7px 0}
.metric .sub{font-size:10px;color:#7088a5}
.section{margin-top:14px}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 10px}
.section-title h2{font-size:15px;margin:0}
.muted{color:var(--muted)}
.smalltext{font-size:11px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.searchbar{display:flex;gap:8px}
.searchbar input{flex:1}
input,textarea,select{background:#091626;color:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{min-height:110px;resize:vertical}
label{display:block;color:#8499b1;font-size:10px;font-weight:750;margin-bottom:5px}
.field{margin-bottom:11px}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.full{grid-column:1/-1}
.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{padding:10px 8px;border-bottom:1px solid #192d45;text-align:left;vertical-align:middle}
th{color:#7087a2;font-size:9px;text-transform:uppercase;letter-spacing:.8px}
tr.clickable:hover{background:#10233a;cursor:pointer}
.pill{display:inline-flex;align-items:center;padding:4px 7px;border-radius:999px;background:#162d4b;color:#aac0dc;font-size:9px}
.pill.good{background:#123c31;color:#6de1b8}
.pill.warn{background:#44341d;color:#ffd18a}
.pill.bad{background:#431c25;color:#ff9aa5}
.pill.purple{background:#2d2148;color:#c4a8ff}
.list{display:flex;flex-direction:column;gap:8px}
.rowitem{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #19304b;border-radius:11px;background:#0a1728}
.thumb{width:52px;height:52px;border-radius:9px;object-fit:cover;background:#091626;border:1px solid var(--line)}
.thumb.empty{display:flex;align-items:center;justify-content:center;color:#5f7691;font-size:18px}
.rowmain{flex:1;min-width:0}
.rowtitle{font-size:12px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowsub{font-size:10px;color:var(--muted);margin-top:3px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed #27415f;border-radius:12px}
.agent{min-height:145px}
.agent h3{font-size:13px;margin:0 0 7px}
.agent p{font-size:11px;line-height:1.5;color:var(--muted);margin:0 0 13px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .grow{flex:1}
.statline{display:flex;gap:10px;flex-wrap:wrap}
.statchip{background:#0a1728;border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:10px;color:#9eb3ca}
.log{font:10px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:#06101c;border:1px solid var(--line);border-radius:10px;padding:11px;white-space:pre-wrap;max-height:280px;overflow:auto;color:#9db3cc}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:flex;align-items:center;justify-content:center;padding:18px}
.modal.hidden{display:none}
.modalbox{background:#0b192b;border:1px solid #2a4565;border-radius:18px;width:min(1050px,100%);max-height:94vh;overflow:auto;box-shadow:0 25px 80px #0008}
.modalhead{position:sticky;top:0;z-index:2;background:#0b192b;border-bottom:1px solid var(--line);padding:15px 17px;display:flex;justify-content:space-between;align-items:center}
.modalhead h2{font-size:17px;margin:0}
.close{border:0;background:none;color:#a9bed6;font-size:25px}
.modalbody{padding:17px}
.editor-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:15px}
.editor-section{background:#0d1b2e;border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:12px}
.editor-section h3{font-size:12px;margin:0 0 10px}
.category-browser{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.category-list{max-height:390px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.catrow{padding:10px;border-bottom:1px solid #19304a;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px}
.catrow:hover{background:#132945}
.catrow.leaf{cursor:pointer}
.catrow .arrow{color:#7189a5}
.aspect-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.aspect{background:#091626;border:1px solid #1a314b;border-radius:10px;padding:9px}
.aspect.required{border-color:#6b3540}
.aspect .aspect-name{font-size:10px;color:#91a5bd;margin-bottom:5px}
.aspect input,.aspect select{padding:8px;font-size:11px}
.image-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.image-tile{position:relative;aspect-ratio:1;background:#091626;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.image-tile img{width:100%;height:100%;object-fit:cover}
.image-tile button{position:absolute;right:4px;top:4px;width:22px;height:22px;border:0;border-radius:50%;background:#000a;color:#fff}
.camera-box{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.capture{border:1px dashed #365272;border-radius:13px;min-height:210px;background:#091626;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.capture img{width:100%;height:100%;object-fit:contain}
.capture .capture-label{position:absolute;left:10px;top:10px;background:#0009;border-radius:7px;padding:5px 7px;font-size:9px}
.bottom-actions{position:sticky;bottom:0;background:#0b192b;border-top:1px solid var(--line);padding:12px 17px;display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;right:18px;bottom:18px;z-index:100;background:#10243b;border:1px solid #315070;border-radius:12px;padding:11px 13px;box-shadow:var(--shadow);font-size:11px;max-width:360px}
.toast.good{border-color:#2e745e}.toast.bad{border-color:#743440}
.mobilebar{display:none}
.hidden{display:none!important}
@media(max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:repeat(2,1fr)}.grid2,.editor-grid{grid-template-columns:1fr}}
@media(max-width:760px){
.sidebar{display:none}.main{margin-left:0;width:100%;padding:14px 12px 78px}.grid4{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr}.fields2,.category-browser,.aspect-grid,.camera-box{grid-template-columns:1fr}.topbar{align-items:flex-start}.heading h1{font-size:23px}.top-actions .desktop{display:none}.mobilebar{position:fixed;display:flex;z-index:30;left:0;right:0;bottom:0;background:#081525;border-top:1px solid var(--line);justify-content:space-around;padding:7px 4px}.mobilebar button{border:0;background:none;color:#9db2ca;font-size:9px}.image-grid{grid-template-columns:repeat(3,1fr)}.modal{padding:8px}.modalbox{max-height:96vh}.modalbody{padding:12px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">S<span>WISH</span></div>
  <div class="workspace" id="workspaceName">Seller workspace</div>

  <div class="navgroup">
    <div class="navgroup-title">Seller Hub</div>
    <button class="nav active" data-page="dashboard"><span class="ico">⌂</span>Dashboard</button>
    <button class="nav" data-page="listings"><span class="ico">▣</span>Listings</button>
    <button class="nav" data-page="inventory"><span class="ico">◫</span>Inventory</button>
    <button class="nav" data-page="orders"><span class="ico">▤</span>Orders</button>
    <button class="nav" data-page="offers"><span class="ico">◉</span>Offers <span class="badge" id="offersBadge"></span></button>
    <button class="nav" data-page="messages"><span class="ico">✉</span>Messages <span class="badge" id="messagesBadge"></span></button>
    <button class="nav" data-page="returns"><span class="ico">↩</span>Returns <span class="badge" id="returnsBadge"></span></button>
    <button class="nav" data-page="cases"><span class="ico">⚑</span>Cases <span class="badge" id="casesBadge"></span></button>
  </div>

  <div class="navgroup">
    <div class="navgroup-title">Money & performance</div>
    <button class="nav" data-page="finances"><span class="ico">£</span>Finances</button>
    <button class="nav" data-page="analytics"><span class="ico">◒</span>Analytics</button>
  </div>

  <div class="navgroup">
    <div class="navgroup-title">SWISH Intelligence</div>
    <button class="nav" data-page="intelligence"><span class="ico">✦</span>Command Centre</button>
    <button class="nav" data-page="research"><span class="ico">⌁</span>Research Agent</button>
    <button class="nav" data-page="scan"><span class="ico">◎</span>Coin Scan</button>
    <button class="nav" data-page="calculations"><span class="ico">∑</span>Calculations</button>
  </div>

  <div class="navgroup">
    <div class="navgroup-title">Data & control</div>
    <button class="nav" data-page="import"><span class="ico">⇩</span>eBay Import</button>
    <button class="nav" data-page="sync"><span class="ico">↻</span>Sync & Images</button>
    <button class="nav" data-page="settings"><span class="ico">⚙</span>Settings</button>
    <button class="nav" data-page="log"><span class="ico">▤</span>System Log</button>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div class="heading">
      <h1 id="pageTitle">Dashboard</h1>
      <p id="pageSub">eBay Seller Hub · SWISH intelligence layer</p>
    </div>
    <div class="top-actions">
      <button class="btn primary desktop" onclick="SWISH.newListing()">＋ New listing</button>
      <button class="btn desktop" onclick="SWISH.sync()">↻ Sync</button>
      <div class="connection"><i class="dot" id="statusDot"></i><span id="statusText">Checking…</span></div>
    </div>
  </div>
  <div id="view"></div>
</main>
</div>

<div class="mobilebar">
 <button data-page="dashboard">⌂<br>Home</button>
 <button data-page="listings">▣<br>Listings</button>
 <button data-page="inventory">◫<br>Stock</button>
 <button data-page="orders">▤<br>Orders</button>
 <button data-page="scan">◎<br>Scan</button>
 <button data-page="intelligence">✦<br>AI</button>
</div>

<div class="modal hidden" id="modal">
 <div class="modalbox">
   <div class="modalhead"><h2 id="modalTitle"></h2><button class="close" onclick="SWISH.closeModal()">×</button></div>
   <div class="modalbody" id="modalBody"></div>
 </div>
</div>
<div id="toastHost"></div>

<script>
'use strict';

/*
 SWISH DREAM WEB
 - Single-file browser front end for the existing SWISH / OnSpace backend.
 - No new database.
 - No eBay secrets in the browser.
 - Existing privileged eBay operations remain behind Edge Functions.
 - Uses the actual routes/tables discovered in the existing SWISH source.
*/

const CFG={
  url:'https://iwgaqieyoahmcjfziwga.backend.onspace.ai',
  anon:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpYXQiOjE3ODkwNjM4MTgsImV4cCI6MjEwNDQyMzgxOCwicmVmIjoiaXdnYXFpZXlvYWhtY2pmeml3Z2EiLCJyb2xlIjoiYW5vbiIsImlzcyI6Im9uc3BhY2UifQ.cioQ38guPLFAbl3x48mUaJcMSxU5IpZn7-H-JhtvXJc'
};

const FN={
 browse:'swish-ebay-browse',
 list:'swish-ebay-list',
 taxonomy:'swish-ebay-taxonomy',
 messages:'swish-ebay-messages',
 orders:'swish-ebay-orders',
 postOrder:'swish-ebay-post-order',
 sync:'swish-ebay-sync',
 identify:'swish-identify',
 islamic:'swish-islamic-identify',
 image:'swish-image-download',
 reprice:'swish-reprice',
 decompose:'swish-decompose',
 marketValue:'swish-market-value',
 generate:'swish-list-generate'
};

const state={
 page:'dashboard', token:localStorage.getItem('swish_access_token')||'',
 refresh:localStorage.getItem('swish_refresh_token')||'',
 user:null, tenant:null, connector:null, cache:{}, log:[],
 listingFilter:'all', listingSearch:'', inventorySearch:'',
 editor:null, category:{parent:'',crumbs:[],items:[],loading:false,search:''},
 aspects:[], toastTimer:null
};

const PAGES={
 dashboard:['Dashboard','eBay Seller Hub · SWISH intelligence layer'],
 listings:['Listings','Create, edit, revise and publish eBay listings'],
 inventory:['Inventory','Canonical stock and listing readiness'],
 orders:['Orders','Fulfilment and customer operations'],
 offers:['Offers','Buyer negotiations and watcher opportunities'],
 messages:['Messages','Buyer communications and response workflow'],
 returns:['Returns','Returns, refunds and deadlines'],
 cases:['Cases','Disputes, INR and SNAD cases'],
 finances:['Finances','Sales, fees, payouts and commercial performance'],
 analytics:['Analytics','Performance and operational intelligence'],
 intelligence:['Command Centre','One screen for what needs attention and what SWISH can do'],
 research:['Research Agent','Natural-language market research and opportunity decomposition'],
 scan:['Coin Scan','Camera-first identification and evidence-backed valuation'],
 calculations:['Calculations','Reusable commercial formulas'],
 import:['eBay Import','CSV reconciliation and controlled import'],
 sync:['Sync & Images','eBay synchronisation and canonical image pipeline'],
 settings:['Settings','Connection, policies and workspace controls'],
 log:['System Log','Diagnostics and backend activity']
};

const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];

function esc(v){
 return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function money(v){
 const n=Number(v); return Number.isFinite(n)?'£'+n.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2}):'—';
}
function date(v){
 if(!v)return '—'; const d=new Date(v); return isNaN(d)?'—':d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}
function timeAgo(v){
 if(!v)return '—'; const ms=Date.now()-new Date(v).getTime(),m=Math.floor(ms/60000);
 if(m<1)return 'just now'; if(m<60)return m+'m ago'; const h=Math.floor(m/60); if(h<24)return h+'h ago'; return Math.floor(h/24)+'d ago';
}
function toast(msg,type=''){
 const h=$('#toastHost'); h.innerHTML='<div class="toast '+type+'">'+esc(msg)+'</div>';
 clearTimeout(state.toastTimer); state.toastTimer=setTimeout(()=>h.innerHTML='',3500);
}
function log(msg){
 state.log.unshift(new Date().toLocaleTimeString()+'  '+msg);
 if(state.log.length>150)state.log.pop();
 const el=$('#logbox'); if(el)el.textContent=state.log.join('\n');
}
function headers(){
 return {'Content-Type':'application/json','apikey':CFG.anon,'Authorization':'Bearer '+(state.token||CFG.anon)};
}
async function rest(table,query={},method='GET',body=null){
 const qs=new URLSearchParams();
 Object.entries(query).forEach(([k,v])=>{if(v!==undefined&&v!==null)qs.set(k,String(v));});
 const r=await fetch(CFG.url+'/rest/v1/'+table+(qs.toString()?'?'+qs:''),{
   method,headers:Object.assign(headers(),{'Accept':'application/json','Prefer':'return=representation'}),body:body?JSON.stringify(body):undefined
 });
 const txt=await r.text(); let d; try{d=txt?JSON.parse(txt):null}catch{d={raw:txt}}
 if(!r.ok)throw new Error(d?.message||d?.error||d?.hint||('HTTP '+r.status));
 return d;
}
async function fn(name,body={}){
 log('→ '+name);
 const r=await fetch(CFG.url+'/functions/v1/'+name,{method:'POST',headers:headers(),body:JSON.stringify(body)});
 const txt=await r.text(); let d; try{d=txt?JSON.parse(txt):null}catch{d={raw:txt}}
 if(!r.ok)throw new Error(d?.error||d?.message||('HTTP '+r.status));
 if(d?.error && d?.success===false)throw new Error(d.error);
 log('✓ '+name);
 return d;
}
async function signIn(email,password){
 const r=await fetch(CFG.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':CFG.anon},body:JSON.stringify({email,password})});
 const d=await r.json(); if(!r.ok)throw new Error(d.error_description||d.msg||d.error||'Sign in failed');
 state.token=d.access_token;state.refresh=d.refresh_token||'';state.user=d.user||null;
 localStorage.setItem('swish_access_token',state.token);if(state.refresh)localStorage.setItem('swish_refresh_token',state.refresh);
}
async function loadTenant(){
 const rows=await rest('tenants',{select:'id,name,slug,subscription_tier,settings,created_at',order:'created_at.asc',limit:1});
 state.tenant=Array.isArray(rows)?rows[0]:null;
 if(!state.tenant)throw new Error('No SWISH tenant found for this account.');
 state.connector=await rest('marketplace_connectors',{select:'status,access_token_expires_at,seller_account_id,last_sync_at,can_publish,selected_fulfillment_policy_id,selected_return_policy_id',tenant_id:'eq.'+state.tenant.id,marketplace_id:'eq.ebay',limit:1}).then(x=>x?.[0]||null).catch(()=>null);
 $('#workspaceName').textContent=state.tenant.name||'Seller workspace';
}
function setStatus(){
 const ok=!!state.tenant;
 $('#statusDot').className='dot '+(ok?'good':'');
 $('#statusText').textContent=ok?'Live · '+(state.tenant.name||'SWISH'):'Sign in required';
}
async function bootstrap(){
 try{
  if(state.token){try{await loadTenant()}catch{state.token='';localStorage.removeItem('swish_access_token');}}
  setStatus(); render();
  if(state.tenant){await refreshDashboard();}else showLogin();
 }catch(e){log('BOOT: '+e.message);setStatus();render();}
}
function showLogin(){
 openModal('Sign in to SWISH',`
 <p class="muted smalltext">Use your existing SWISH account. This browser uses the existing authentication and backend; it does not create a new database.</p>
 <div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="email"></div>
 <div class="field"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password"></div>
 <div class="actions"><button class="btn primary" onclick="SWISH.login()">Sign in</button><button class="btn ghost" onclick="SWISH.closeModal()">View shell</button></div>
 <div id="loginError" class="smalltext" style="color:var(--bad);margin-top:10px"></div>`);
}
async function login(){
 try{await signIn($('#loginEmail').value.trim(),$('#loginPass').value);await loadTenant();closeModal();setStatus();render();await refreshDashboard();toast('Signed in','good')}
 catch(e){$('#loginError').textContent=e.message}
}
function openModal(title,body,extraClass=''){ $('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').classList.remove('hidden'); }
function closeModal(){ $('#modal').classList.add('hidden'); }
function go(page){if(!PAGES[page])return;state.page=page;render();window.scrollTo(0,0);}
function navBind(){
 $$('.nav,[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));
}
function render(){
 const [title,sub]=PAGES[state.page]||PAGES.dashboard;
 $('#pageTitle').textContent=title;$('#pageSub').textContent=sub;
 $$('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));
 const views={
  dashboard:renderDashboard,listings:renderListings,inventory:renderInventory,orders:renderOrders,

async function refreshDashboard(){
 if(!state.tenant)return;
 const tid=state.tenant.id, start=new Date(new Date().getFullYear(),new Date().getMonth(),1).toISOString();
 try{
  const [listings,items,orders,msg,returns,cases,offers,sales,fin]=await Promise.all([
   rest('listings',{select:'id,status,price',tenant_id:'eq.'+tid,marketplace_id:'eq.ebay',limit:2000}),
   rest('items',{select:'id,status,quantity',tenant_id:'eq.'+tid,limit:2000}),
   rest('orders',{select:'id,fulfilment_status',tenant_id:'eq.'+tid,marketplace_id:'eq.ebay',limit:2000}),
   rest('ebay_messages',{select:'id',tenant_id:'eq.'+tid,is_read:'eq.false',direction:'eq.inbound',limit:1000}),
   rest('ebay_returns',{select:'id',tenant_id:'eq.'+tid,status:'not.eq.closed',limit:1000}).catch(()=>[]),
   rest('ebay_cases',{select:'id,status',tenant_id:'eq.'+tid,limit:1000}).catch(()=>[]),
   rest('ebay_offers',{select:'id,status',tenant_id:'eq.'+tid,status:'eq.pending',limit:1000}).catch(()=>[]),
   rest('sales',{select:'sale_price,net_revenue,sold_at',tenant_id:'eq.'+tid,marketplace_id:'eq.ebay',sold_at:'gte.'+start,limit:2000}).catch(()=>[]),
   rest('ebay_financials',{select:'amount,transaction_type,transaction_date',tenant_id:'eq.'+tid,transaction_date:'gte.'+start,limit:5000}).catch(()=>[])
  ]);
  const active=listings.filter(x=>x.status==='active').length;
  const drafts=listings.filter(x=>['draft','pending'].includes(x.status)).length;
  const stock=items.filter(x=>!['sold','archived'].includes(x.status)).length;
  const dispatch=orders.filter(x=>['awaiting_dispatch','packing','label_created'].includes(x.fulfilment_status)).length;
  const revenue=sales.reduce((a,x)=>a+Number(x.sale_price||0),0);
  const net=sales.reduce((a,x)=>a+Number(x.net_revenue||0),0);
  state.cache.dashboard={active,drafts,stock,dispatch,revenue,net,unread:msg.length,returns:returns.length,cases:cases.filter(x=>!['closed','resolved'].includes(x.status)).length,offers:offers.length,fin};
  updateBadges();log('Dashboard refreshed');render();
 }catch(e){log('Dashboard refresh: '+e.message)}
}
function updateBadges(){
 const d=state.cache.dashboard||{};
 ['offers','messages','returns','cases'].forEach(k=>{const el=$('#'+k+'Badge');if(el)el.textContent=d[k]||''});
}

async function loadListings(){
 const el=$('#listingRows');if(!el||!state.tenant)return;
 try{
  const rows=await rest('listings',{select:'*,items(id,canonical_title,media,sku,condition,attributes,quantity)',tenant_id:'eq.'+state.tenant.id,marketplace_id:'eq.ebay',order:'updated_at.desc',limit:500});
  state.cache.listings=rows||[]; drawListings();
 }catch(e){el.innerHTML='<div class="empty">'+esc(e.message)+'</div>';log('Listings: '+e.message)}
}
function drawListings(){
 const el=$('#listingRows');if(!el)return;
 let rows=state.cache.listings||[];
 const q=state.listingSearch.toLowerCase();
 if(q)rows=rows.filter(r=>(r.title||'').toLowerCase().includes(q)||(r.external_listing_id||'').toLowerCase().includes(q)||(r.items?.sku||'').toLowerCase().includes(q));
 if(state.listingFilter!=='all')rows=rows.filter(r=>r.status===state.listingFilter);
 if(!rows.length){el.innerHTML='<div class="empty">No listings match this view.</div>';return}
 el.innerHTML=rows.map(r=>{
  const media=Array.isArray(r.items?.media)?r.items.media[0]:null;
  return `<div class="rowitem">
   ${media?`<img class="thumb" src="${esc(media)}" onerror="this.style.display='none'">`:'<div class="thumb empty">▣</div>'}
   <div class="rowmain"><div class="rowtitle">${esc(r.title||r.items?.canonical_title||'Untitled listing')}</div>
   <div class="rowsub">${esc(r.external_listing_id||'Draft')} · ${money(r.price)} · ${esc(r.status||'')}</div></div>
   <span class="pill ${r.status==='active'?'good':r.status==='draft'?'warn':''}">${esc(r.status||'')}</span>
   <button class="btn small" onclick="SWISH.editListing('${r.id}')">Edit</button>
  </div>`}).join('');
}
function renderListings(){
 return `<div class="card">

function calculate(){
 const formula=$('#calcFormula').value,vals={};$$('.var').forEach(x=>vals[x.dataset.v]=Number(x.value)||0);let expr=formula;
 Object.entries(vals).forEach(([k,v])=>expr=expr.replace(new RegExp('\\b'+k+'\\b','g'),String(v)));
 if(!/^[0-9+\-*/().\s]+$/.test(expr)){toast('Formula contains unsupported characters','bad');return}
 try{const result=Function('return ('+expr+')')();$('#calcResult').innerHTML='<div class="card"><div class="smalltext muted">'+esc($('#calcName').value)+'</div><div style="font-size:30px;font-weight:900;margin:5px 0">'+esc(result)+'</div><div class="log">'+esc(formula)+' = '+esc(expr)+'</div></div>'}catch{toast('Could not calculate formula','bad')}
}

 if(x&&typeof x==='object')return Object.entries(x).map(([name,value])=>({name,value:String(value??'')}));
 return [];
}

async function browseRootCategories(){
 const box=$('#catList'),note=$('#catNote');
 box.innerHTML='<div class="empty">Connecting to the LIVE eBay UK category tree…</div>';
 note.innerHTML='<span class="pill">LIVE</span> Getting the current eBay UK category tree…';
 try{
   if(!state.tenant)throw new Error('Sign in to SWISH first.');
   const health=await fn(FN.taxonomy,{route:'health',tenantId:state.tenant.id});
   const data=await fn(FN.taxonomy,{route:'get_category_children',tenantId:state.tenant.id,parentId:'0'});
   const rows=Array.isArray(data?.children)?data.children:[];
   if(!rows.length)throw new Error('eBay returned no top-level categories.');
   state.category.items=rows;
   box.innerHTML=rows.map(c=>`<div class="catrow ${c.isLeaf?'leaf':''}" onclick="SWISH.openCategoryNode('${esc(c.id)}','${esc(c.name)}',${c.isLeaf?'true':'false'})"><span><b>${esc(c.name)}</b><small style="display:block;color:var(--muted);margin-top:3px">ID ${esc(c.id)}</small></span><span class="arrow">${c.isLeaf?'✓ Leaf':'›'}</span></div>`).join('');
   note.innerHTML=`<span class="pill good">LIVE</span> eBay UK tree ${esc(health?.categoryTreeId||data?.categoryTreeId||'')} · version ${esc(health?.categoryTreeVersion||data?.categoryTreeVersion||'')}`;
   log('eBay taxonomy connected: UK tree '+(health?.categoryTreeId||data?.categoryTreeId||'?')+' version '+(health?.categoryTreeVersion||data?.categoryTreeVersion||'?'));
 }catch(e){
   const msg=e?.message||'Live category connection failed.';
   box.innerHTML=`<div class="empty" style="border-color:#71313d"><b style="color:var(--bad)">LIVE eBay category connection failed</b><p class="smalltext muted">${esc(msg)}</p><button class="btn small" onclick="SWISH.browseRootCategories()">Retry</button></div>`;
   note.innerHTML='<span class="pill bad">LIVE LOOKUP FAILED</span> eBay returned an error — no fallback catalogue is being used.';
   log('eBay taxonomy ERROR: '+msg);
 }
}

async function openCategoryNode(id,name,isLeaf){

   try{
     const data=await fn(FN.taxonomy,{route:'verify_leaf',tenantId:state.tenant.id,categoryId:id});
     if(!data?.isLeaf)throw new Error('eBay did not verify this category as a leaf.');
     chooseLiveCategory(id,name,name);
   }catch(e){toast(e?.message||'Category verification failed','bad');}
   return;
 }
 const box=$('#catList'),note=$('#catNote');
 box.innerHTML='<div class="empty">Loading live child categories from eBay…</div>';
 try{
   const data=await fn(FN.taxonomy,{route:'get_category_children',tenantId:state.tenant.id,parentId:id});

function normaliseLiveCategoryResults(data){
 const raw=
   data?.categories||
   data?.suggestions||
   data?.categorySuggestions||
   data?.leafCategories||
   data?.results||
   data?.candidates||
   [];

 const arr=Array.isArray(raw)?raw:[raw];
 const out=[];

 function add(x, inheritedPath=[]){
   if(!x||typeof x!=='object')return;
   const c=x.category||x.categoryRef||x.leafCategory||x;
   const id=String(c?.id??c?.categoryId??x?.id??x?.categoryId??'');
   const name=String(c?.name??c?.categoryName??x?.name??x?.categoryName??'');
   const leaf=
     c?.leafCategoryTreeNode===true ||
     x?.leafCategoryTreeNode===true ||
     c?.isLeaf===true ||
     x?.isLeaf===true ||
     x?.leaf===true ||
     x?.verifiedLeaf===true ||
     x?.wasResolved===true ||
     x?.confidence==='high' ||
     x?.confidence==='verified';

   const ancestors=[
     ...(Array.isArray(x?.categoryTreeNodeAncestors)?x.categoryTreeNodeAncestors:[]),
     ...(Array.isArray(c?.categoryTreeNodeAncestors)?c.categoryTreeNodeAncestors:[]),
     ...inheritedPath
   ].map(a=>a?.categoryName||a?.name).filter(Boolean);

   if(id&&name&&leaf){
     const key=id+'|'+name;
     if(!out.some(r=>r.key===key)){
       out.push({key,id,name,leaf:true,path:[...new Set([...ancestors,name])].join(' › ')});
     }
   }

   if(Array.isArray(x?.children))x.children.forEach(ch=>add(ch,[...ancestors,name]));
   if(Array.isArray(x?.childCategoryTreeNodes))x.childCategoryTreeNodes.forEach(ch=>add(ch,[...ancestors,name]));
 }
 arr.forEach(x=>add(x));

 // Some versions of the resolver return a single resolved object.
 if(!out.length){
   const candidates=[
     data?.resolvedCategory,
     data?.category,
     data?.resolved,
     data?.result
   ].filter(Boolean);
   candidates.forEach(x=>add(x));
 }

 return out;
}

 if(!q){
   box.innerHTML='<div class="empty">Enter a product description or search term.</div>';

 note.innerHTML='<span class="pill">LIVE</span> Querying the existing SWISH server-side eBay category resolver…';

 try{
   if(!state.tenant)throw new Error('Sign in to SWISH first.');
   /*
     Important: resolve_category is the production route documented by the
     existing swish-ebay-list Edge Function. It keeps eBay credentials server-side.
   */
   const data=await fn(FN.taxonomy,{
     route:'resolve_category',
     tenantId:state.tenant.id,
     title:q,
     searchQuery:q,
     categoryId:'',
     specialistId:''
   });

   const rows=normaliseLiveCategoryResults(data);

   if(!rows.length){
     // Do NOT substitute fake categories.
     throw new Error('eBay returned no verified leaf categories for that search.');
   }

   state.category.items=rows;

       </span>
       <span class="arrow">✓ Leaf</span>
     </div>`).join('');

   note.innerHTML=`<span class="pill good">${rows.length} LIVE</span> eBay leaf categories returned`;
   log(`eBay taxonomy: ${rows.length} live leaf categories for "${q}"`);
 }catch(e){
   const msg=e?.message||'Live eBay category lookup failed.';
   box.innerHTML=`<div class="empty" style="border-color:#71313d">
     <b style="color:var(--bad)">Live eBay category lookup failed</b>
     <p class="smalltext muted">${esc(msg)}</p>

   log('eBay taxonomy ERROR: '+msg);
 }
}

async function uploadEditorImages(itemId, urls){
 const out=[];
 for(let i=0;i<urls.length;i++){
  const u=urls[i];
  if(typeof u!=='string')continue;
  if(/^https:\/\//.test(u)){out.push(u);continue}
  try{
   const res=await fetch(u);const blob=await res.blob();
   const path=itemId+'/'+Date.now()+'_'+i+'.jpg';
   const up=await fetch(CFG.url+'/storage/v1/object/item-images/'+encodeURIComponent(path),{method:'POST',headers:Object.assign(headers(),{'Content-Type':blob.type||'image/jpeg','x-upsert':'true'}),body:blob});
   if(!up.ok)throw new Error('image upload HTTP '+up.status);
   out.push(CFG.url+'/storage/v1/object/public/item-images/'+path);
  }catch(e){log('Image upload failed: '+e.message)}
 }
 return out;
}

function swishTempCategoryResults(q){
 const words=(q||'').toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>1);
 if(!words.length)return SWISH_TEMP_EBAY_GB_CATEGORIES.filter(x=>x.leaf);
 const scored=SWISH_TEMP_EBAY_GB_CATEGORIES.filter(x=>x.leaf).map(x=>{
   const hay=(x.name+' '+x.path).toLowerCase();
   let score=0;
   for(const w of words){ if(hay.includes(w))score+=hay===w?10:3; }
   if(/coin|ancient|roman|greek|islamic|silver|dirham|drachm|token|medal/.test(q.toLowerCase()) && /coin|token|medal|greek|roman|islamic|persian|indian|byzantine|british/.test(hay))score+=2;
   return {...x,score};
 }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));
 return scored.length?scored.slice(0,30):SWISH_TEMP_EBAY_GB_CATEGORIES.filter(x=>x.leaf).slice(0,30);
}

function categoryHtml(){
 return `<div class="field">
   <label>eBay UK category (temporary offline cache)</label>
   <div class="searchbar">
     <input id="catSearch" placeholder="e.g. ancient silver coin, medal, binoculars, books…" onkeydown="if(event.key==='Enter')SWISH.searchCategories()">
     <button class="btn primary" onclick="SWISH.searchCategories()">Search Categories</button>
   </div>
 </div>
 <div id="catNote" class="smalltext" style="margin:8px 0 12px"><span class="pill">TEMPORARY</span> Single-user offline eBay UK category cache. No backend required.</div>
 <div class="category-browser"><div><div class="smalltext muted" style="margin-bottom:6px">eBay UK cached leaf categories</div><div id="catList" class="category-list"><div class="empty">Search for a category.</div></div></div>
 <div><div class="smalltext muted" style="margin-bottom:6px">Selection</div><div id="catSelection" class="card"><b id="catSelectedName">${esc(state.editor?.categoryName||'No category selected')}</b><p class="muted smalltext" id="catSelectedId">Category ID: ${esc(state.editor?.categoryId||'—')}</p><p class="muted smalltext">Temporary cache only. Final live Taxonomy validation will be restored when backend access is available.</p></div></div></div>`;
}
function openCategories(){
 openModal('eBay UK category browser',categoryHtml());
 const title=state.editor?.title?.trim()||'';
 if(title){$('#catSearch').value=title;searchCategories();}
}
async function browseRootCategories(){searchCategories();}
async function searchCategories(){
 const q=($('#catSearch')?.value||'').trim();
 const box=$('#catList'),note=$('#catNote');
 const rows=swishTempCategoryResults(q);
 box.innerHTML=rows.map(c=>`<div class="catrow leaf" onclick="SWISH.chooseLiveCategory('${esc(c.id)}','${esc(c.name)}','${esc(c.path)}')"><span><b>${esc(c.name)}</b><small style="display:block;color:var(--muted);margin-top:3px">${esc(c.path)} · eBay UK ID ${esc(c.id)}</small></span><span class="arrow">✓ Leaf</span></div>`).join('');
 note.innerHTML=`<span class="pill">TEMPORARY</span> ${rows.length} cached eBay UK leaf categories. These IDs are from eBay's published UK category structure; live verification is deliberately disabled in offline mode.`;
}
async function loadAspectsIfNeeded(){
 const box=document.getElementById('aspects')||document.getElementById('itemAspects');
 if(box)box.innerHTML='<div class="smalltext muted"><span class="pill">TEMPORARY</span> Live eBay item specifics require the backend Taxonomy API. Category ID is saved and will be live-validated when backend access is restored.</div>';
}

// Expose the offline replacements.
try{Object.assign(SWISH,{openCategories,browseRootCategories,searchCategories,loadAspectsIfNeeded});}catch(e){}

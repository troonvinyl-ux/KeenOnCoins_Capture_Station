<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SWISH — eBay Seller Intelligence</title>
<style>
:root{--bg:#07111f;--panel:#0d1a2c;--panel2:#10223a;--line:#1e3552;--text:#edf5ff;--muted:#91a5bd;--accent:#5b8cff;--good:#37d39a;--warn:#ffbf69;--bad:#ff6b7a;--radius:16px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.side{width:250px;background:#081525;border-right:1px solid var(--line);padding:18px 12px;position:fixed;inset:0 auto 0 0;z-index:5;overflow:auto}
.brand{font-weight:900;font-size:24px;padding:7px 10px 18px;letter-spacing:.4px}
.brand span{color:#78a3ff}
.group{margin:16px 0 6px 10px;color:#607895;text-transform:uppercase;font-size:10px;font-weight:800;letter-spacing:1.2px}
.nav{display:block;width:100%;border:0;background:transparent;color:#a9bad0;text-align:left;padding:10px 12px;border-radius:11px;margin:2px 0;font-size:14px}
.nav:hover,.nav.active{background:#142845;color:#fff}
.main{margin-left:250px;width:calc(100% - 250px);padding:22px;max-width:1600px}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}
.title h1{font-size:28px;margin:0 0 5px}
.title p{margin:0;color:var(--muted);font-size:13px}
.status{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:9px 12px;border-radius:12px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.dot.good{background:var(--good)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:17px;box-shadow:0 8px 30px #0002}
.metric .label{color:var(--muted);font-size:12px}
.metric .value{font-size:27px;font-weight:850;margin:7px 0}
.metric .sub{font-size:11px;color:#738aa5}
.section{margin-top:18px}
.section h2{font-size:16px;margin:0 0 10px}
.two{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}
.agentgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.agent{min-height:140px}
.agent h3{margin:0 0 7px;font-size:14px}
.agent p{color:var(--muted);font-size:12px;line-height:1.5;margin:0 0 14px}
.btn{border:1px solid var(--line);background:#132a49;color:#fff;padding:9px 12px;border-radius:10px;font-weight:700;font-size:12px}
.btn:hover{background:#1a3961}
.btn.primary{background:var(--accent);border-color:var(--accent)}
.btn.danger{background:#3b1720;border-color:#71313d}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.search{display:flex;gap:8px}
.search input,.field input,.field textarea,.field select{width:100%;background:#091626;border:1px solid var(--line);color:#fff;border-radius:10px;padding:10px 11px;outline:none}
.search input:focus,.field input:focus,.field textarea:focus{border-color:#5b8cff}
.search input{flex:1}
.tablewrap{overflow:auto}
.table{width:100%;border-collapse:collapse;font-size:12px}
.table th,.table td{padding:11px 8px;border-bottom:1px solid #1a2d45;text-align:left;white-space:nowrap}
.table th{color:#7890aa;font-size:10px;text-transform:uppercase;letter-spacing:.8px}
.pill{padding:4px 7px;border-radius:999px;background:#162b46;color:#9fbae0;font-size:10px}
.log{font-family:ui-monospace,monospace;background:#06101c;border:1px solid var(--line);border-radius:10px;padding:10px;min-height:120px;max-height:250px;overflow:auto;color:#9eb3ca;font-size:11px;white-space:pre-wrap}
.hidden{display:none}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.modalbox{background:#0c192a;border:1px solid var(--line);border-radius:18px;width:min(760px,100%);max-height:90vh;overflow:auto;padding:20px}
.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.modalhead h2{margin:0;font-size:18px}
.close{background:none;border:0;color:#9fb1c7;font-size:22px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field.full{grid-column:1/-1}
.field label{display:block;color:#8297b0;font-size:11px;margin-bottom:5px}
.field textarea{min-height:110px;resize:vertical}
.mobilebar{display:none}
.empty{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:1050px){
.grid{grid-template-columns:repeat(2,1fr)}
.two{grid-template-columns:1fr}
.agentgrid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:760px){
.side{display:none}
.main{margin-left:0;width:100%;padding:15px;padding-bottom:75px}
.grid{grid-template-columns:1fr 1fr}
.agentgrid{grid-template-columns:1fr}
.top{align-items:flex-start}
.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#081525;border-top:1px solid var(--line);z-index:10;justify-content:space-around;padding:8px}
.mobilebar button{background:none;border:0;color:#8fa5bf;font-size:10px}
.fields{grid-template-columns:1fr}
.field.full{grid-column:auto}
.title h1{font-size:23px}
}
</style>
</head>

(function(){

const SUPABASE_URL='https://iwgaqieyoahmcjfziwga.backend.onspace.ai';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpYXQiOjE3ODkwNjM4MTgsImV4cCI6MjEwNDQyMzgxOCwicmVmIjoiaXdnYXFpZXlvYWhtY2pmeml3Z2EiLCJyb2xlIjoiYW5vbiIsImlzcyI6Im9uc3BhY2UifQ.cioQ38guPLFAbl3x48mUaJcMSxU5IpZn7-H-JhtvXJc';
const FN={
browse:'swish-ebay-browse',
list:'swish-ebay-list',
messages:'swish-ebay-messages',

postOrder:'swish-ebay-post-order',

page:'dashboard',

const $=s=>document.querySelector(s);

function esc(v){
return String(v??'').replace(/[&<>"']/g,c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[c]));
}
function money(v){
const n=Number(v);
return Number.isFinite(n)
?'£'+n.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})
:'—';
}
function log(msg){
state.log.unshift(new Date().toLocaleTimeString()+'  '+msg);
if(state.log.length>80)
state.log.pop();
const el=$('#logbox');
if(el)
el.textContent=state.log.join('\n');
}
async function fn(name,body){
log('Calling '+name+'…');
const r=await fetch(
SUPABASE_URL+'/functions/v1/'+name,
{
method:'POST',
headers:{
'Content-Type':'application/json',
'apikey':SUPABASE_ANON,
'Authorization':'Bearer '+SUPABASE_ANON
},
body:JSON.stringify(body||{})
}
);
const text=await r.text();
let data;
try{
data=JSON.parse(text);
}
catch{
data={raw:text};
}
if(!r.ok)
throw new Error(
(data&&data.error)||('HTTP '+r.status)
);
log(name+' returned successfully');
return data;
}
async function backend(){
try{
await fetch(
SUPABASE_URL+'/rest/v1/',
{
headers:{
apikey:SUPABASE_ANON,
Authorization:'Bearer '+SUPABASE_ANON
}
}
);
$('#statusDot').className='dot good';
$('#statusText').textContent='Backend reachable';
}
catch(e){
$('#statusText').textContent='Backend connection unavailable';
log('Backend check failed: '+e.message);
}
}

function render(){
const p=state.page;
$('#pageTitle').textContent=pages[p].title;
$('#pageSub').textContent=pages[p].sub;
$$('.nav').forEach(
b=>b.classList.toggle('active',b.dataset.page===p)
);
let html='';
if(p==='dashboard')
html=renderDashboard();
else if(p==='intelligence'||p==='decomposer')
html=renderIntelligence();
else if(p==='identify')
html=renderIdentify();
else if(p==='calculations')
html=renderCalculations();
else if(p==='import')
html=renderImport();
else if(p==='log')
html=`
<div class="card">
<h2>Integration log</h2>
<div id="logbox" class="log">
${esc(state.log.join('\n')||'No events yet.')}
</div>
</div>
`;
else
html=renderGeneric(p);
$('#view').innerHTML=html;
if(p==='import')
$('#csv').addEventListener('change',csvPreview);
}
function csvPreview(e){
const f=e.target.files[0];
if(!f)return;
const r=new FileReader();
r.onload=()=>{
$('#csvInfo').innerHTML=`
<div class="card">
<b>${esc(f.name)}</b>
<p style="color:var(--muted);font-size:12px">
${f.size.toLocaleString()} bytes loaded locally.
No database write has occurred.
</p>
</div>
`;
log('CSV selected: '+f.name);
};
r.readAsText(f);
}
function go(p){
if(!pages[p])
return;
state.page=p;
render();
window.scrollTo(0,0);
}
function modal(title,body){

$('#modalBody').innerHTML=body;

}

async function load(page){
const el=$('#data_'+page);
if(!el)
return;
el.innerHTML='<div class="empty">Loading…</div>';
try{
let d;
if(page==='orders')
d=await fn(FN.orders,{limit:50});
else if(page==='messages')
d=await fn(FN.messages,{limit:50});
else if(page==='listings'||page==='inventory')
d=await fn(FN.browse,{limit:100});
else
d=await fn(FN.sync,{});
state.cache[page]=d;
el.innerHTML=`
<div class="log">
${esc(JSON.stringify(d,null,2))}
</div>
`;
}
catch(e){
el.innerHTML=`
<div class="card"
style="border-color:#71313d">
<b>Request failed</b>
<p style="color:var(--muted);font-size:12px">
${esc(e.message)}
</p>
</div>
`;
log('ERROR: '+e.message);
}
}

}

function decompose(){
const q=$('#objective').value.trim();
if(!q)
return;
const terms=q.toLowerCase().match(
/\b(scotland|england|wales|ireland|obol|stater|litra|joblots?|collections?|coins?|ending|hours?|days?|silver|gold|ancient|islamic)\b/g
)||[];
$('#decompResult').innerHTML=`
<div class="card">
<h3 style="margin-top:0">
Execution plan
</h3>
<ol style="color:var(--muted);font-size:12px;line-height:1.7">
<li>Parse objective and constraints.</li>
<li>Search candidate eBay lots through the existing browse endpoint.</li>
<li>Decompose promising lots into identifiable components.</li>
<li>Require evidence for attribution and market value.</li>
<li>Calculate fees, risk and opportunity using the selected formula.</li>
<li>Present candidates for human approval — no automatic purchase.</li>
</ol>
<div class="log">
Detected terms:
${esc([...new Set(terms)].join(', ')||'none')}
</div>
</div>
`;
log('Decomposition prepared for: '+q);
}
function calculate(){
const formula=$('#calcFormula').value;
const vals={};
$$('.var').forEach(
x=>vals[x.dataset.v]=Number(x.value)||0
);
let expr=formula;
Object.keys(vals).forEach(
k=>expr=expr.replace(
new RegExp('\\b'+k+'\\b','g'),
String(vals[k])
)
);
if(!/^[0-9+\-*/().\s]+$/.test(expr)){
$('#calcResult').innerHTML=
'<p style="color:var(--bad)">Formula contains unsupported characters.</p>';
return;
}
let result;
try{
result=Function('return ('+expr+')')();
}
catch(e){
$('#calcResult').innerHTML=
'<p style="color:var(--bad)">Could not calculate formula.</p>';
return;
}
$('#calcResult').innerHTML=`
<div class="card">
<div style="color:var(--muted);font-size:11px">
${esc($('#calcName').value)}
</div>
<div style="font-size:30px;font-weight:850;margin-top:5px">
${esc(String(result))}
</div>
<div class="log" style="margin-top:10px">
${esc(formula)} = ${esc(expr)}
</div>
</div>
`;
}

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090f">
<title>SWISH — KeenOnCoins</title>
<style>
:root{--bg:#07090f;--panel:#10131b;--panel2:#151923;--line:#272c38;--text:#f2f6ff;--muted:#8790a3;--accent:#4f8ff7;--good:#39d39a;--warn:#ffbf69;--bad:#ff6b7a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.main{width:min(1100px,100%);margin:auto;padding:16px 14px 105px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:6px 0 15px;margin-bottom:12px}.brand{font-size:29px;font-weight:950}.brand span{color:var(--accent)}.status{font-size:11px;color:var(--muted);margin-top:2px}
.conn{font-size:11px;color:var(--muted);white-space:nowrap}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:6px}.dot.good{background:var(--good)}
.nav{display:flex;gap:7px;overflow:auto;padding:2px 0 12px}.nav button,.pill{flex:0 0 auto;border:1px solid var(--line);background:#11151e;color:#9da6b7;border-radius:999px;padding:9px 13px}.nav button.active{background:#17345f;color:#72a8ff;border-color:#376fc4}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{padding:14px}.metric b{font-size:25px;display:block;margin:5px 0}.muted{color:var(--muted);font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{flex:1;min-width:180px}
.btn{border:1px solid var(--line);background:#181d27;color:#fff;border-radius:12px;padding:10px 14px}.primary{background:var(--accent);border-color:var(--accent);color:#07111f}.good{background:#113a2d;border-color:#287c5b}.bad{background:#3a151b;border-color:#702630}.warn{background:#3b2b12;border-color:#806021}
input,select,textarea{background:#0b0f16;color:#fff;border:1px solid var(--line);border-radius:11px;padding:10px}textarea{min-height:120px;width:100%}.empty{text-align:center;padding:28px;color:var(--muted);border:1px dashed #334055;border-radius:14px}.error{color:#ffacb5;background:#35151d;padding:11px;border-radius:12px}.success{color:#70e4bc;background:#123c31;padding:11px;border-radius:12px}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #20242e}.row:last-child{border-bottom:0}.grow{flex:1;min-width:0}.thumb{width:62px;height:62px;object-fit:cover;border-radius:13px;background:#191d27}.title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{font-weight:900}.tag{display:inline-block;font-size:10px;padding:4px 7px;border-radius:8px;background:#1a2130;color:#9fb0cc;margin-right:5px}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.tabs button{background:#121721;border:1px solid var(--line);color:#aab2c2;border-radius:9px;padding:8px 10px}.tabs button.active{background:#1b3762;color:#fff}
pre{white-space:pre-wrap;word-break:break-word;font-size:11px;background:#090c12;padding:12px;border-radius:10px;max-height:500px;overflow:auto}.bottom{position:fixed;bottom:0;left:0;right:0;background:#090b11ee;border-top:1px solid var(--line);padding:7px;z-index:20}.bottomin{width:min(700px,100%);margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.bottom button{background:none;border:0;color:#777f91;padding:7px 3px;font-size:10px}.bottom button.active{color:#72a8ff}
.hidden{display:none!important}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.two,.three{grid-template-columns:1fr}.main{padding-left:10px;padding-right:10px}.brand{font-size:25px}.top{align-items:flex-start}}
</style>
</head>
<body>
<div class="app"><main class="main">
<div class="top">
  <div><div class="brand">S<span>WISH</span></div><div class="status">KeenOnCoins · GitHub web app · existing SWISH backend</div></div>
  <div id="connection" class="conn"><span class="dot"></span>Connecting…</div>
</div>
<div class="nav" id="nav"></div>
<div id="view"></div>
</main></div>
<div class="bottom"><div class="bottomin" id="bottom"></div></div>

<script>
/* =========================================================
   SWISH GITHUB SINGLE-FILE WEB APP
   Existing OnSpace backend is canonical.
   No new database. No new Edge Functions. No GitHub writes.
   ========================================================= */
const CFG={
  url:'https://iwgaqieyoahmcjfziwga.backend.onspace.ai',
  anon:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpYXQiOjE3ODkwNjM4MTgsImV4cCI6MjEwNDQyMzgxOCwicmVmIjoiaXdnYXFpZXlvYWhtY2pmeml3Z2EiLCJyb2xlIjoiYW5vbiIsImlzcyI6Im9uc3BhY2UifQ.cioQ38guPLFAbl3x48mUaJcMSxU5IpZn7-H-JhtvXJc'
};
const FN={
 browse:'swish-ebay-browse',
 list:'swish-ebay-list',
 taxonomy:'swish-ebay-taxonomy',
 messages:'swish-ebay-messages',
 orders:'swish-ebay-orders',
 postOrder:'swish-ebay-post-order',
 sync:'swish-ebay-sync',
 identify:'swish-identify',
 islamic:'swish-islamic-identify',
 image:'swish-image-download',
 reprice:'swish-reprice',
 decompose:'swish-decompose',
 marketValue:'swish-market-value',
 generate:'swish-list-generate'
};
const state={
 page:'dashboard', sub:'overview',
 token:localStorage.getItem('swish_access_token')||'',
 refresh:localStorage.getItem('swish_refresh_token')||'',
 tenant:null, connector:null, cache:{}, selectedItem:null
};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=v=>Number.isFinite(Number(v))?'£'+Number(v).toFixed(2):'—';
function setStatus(ok,text){$('#connection').innerHTML='<span class="dot '+(ok?'good':'')+'"></span>'+esc(text)}

async function rest(table,params={},method='GET',body=null){
  const u=new URL(CFG.url+'/rest/v1/'+table);
  Object.entries(params||{}).forEach(([k,v])=>u.searchParams.set(k,v));
  const h={apikey:CFG.anon,Authorization:'Bearer '+(state.token||CFG.anon),'Content-Type':'application/json'};
  const r=await fetch(u,{method,headers:h,body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>null);
  if(!r.ok)throw new Error(d?.message||d?.error_description||d?.error||'Backend request failed');
  return d;
}
async function fn(name,body={}){
  const r=await fetch(CFG.url+'/functions/v1/'+name,{
    method:'POST',
    headers:{'Content-Type':'application/json',apikey:CFG.anon,Authorization:'Bearer '+(state.token||CFG.anon)},
    body:JSON.stringify(body)
  });
  const d=await r.json().catch(()=>null);
  if(!r.ok)throw new Error(d?.error||d?.message||'SWISH function failed');
  return d;
}
async function loadTenant(){
  const rows=await rest('tenants',{select:'id,name,slug,subscription_tier,settings,created_at',order:'created_at.asc',limit:1});
  state.tenant=rows?.[0]||null;
  if(!state.tenant)throw new Error('No SWISH tenant found.');
  state.connector=await rest('marketplace_connectors',{
    select:'status,access_token_expires_at,seller_account_id,last_sync_at,can_publish,selected_fulfillment_policy_id,selected_return_policy_id',
    tenant_id:'eq.'+state.tenant.id,marketplace_id:'eq.ebay',limit:1
  }).then(x=>x?.[0]||null).catch(()=>null);
}
async function signIn(email,password){
  const r=await fetch(CFG.url+'/auth/v1/token?grant_type=password',{
    method:'POST',headers:{'Content-Type':'application/json',apikey:CFG.anon},
    body:JSON.stringify({email,password})
  });
  const d=await r.json().catch(()=>null);
  if(!r.ok)throw new Error(d?.error_description||d?.msg||d?.error||'Sign in failed');
  state.token=d.access_token||'';state.refresh=d.refresh_token||'';
  localStorage.setItem('swish_access_token',state.token);
  if(state.refresh)localStorage.setItem('swish_refresh_token',state.refresh);
  await loadTenant();render();
}
function nav(){
  const items=[
    ['dashboard','⌂ Home'],['listings','▣ eBay'],['inventory','◫ Inventory'],
    ['orders','▤ Orders'],['scan','◉ Identify'],['more','••• More']
  ];
  $('#nav').innerHTML=items.map(x=>`<button class="${state.page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');
  $('#bottom').innerHTML=items.slice(0,5).map(x=>`<button class="${state.page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');
}
function go(p){state.page=p;render()}
function render(){
  nav();
  const v=$('#view');
  if(state.page==='dashboard')v.innerHTML=dashboard();
  else if(state.page==='inventory')v.innerHTML=inventory();
  else if(state.page==='listings')v.innerHTML=listings();
  else if(state.page==='orders')v.innerHTML=orders();
  else if(state.page==='scan')v.innerHTML=scan();
  else v.innerHTML=more();
  if(state.page==='inventory')setTimeout(loadInventory,0);
  if(state.page==='listings')setTimeout(loadListings,0);
  if(state.page==='orders')setTimeout(loadOrders,0);
}
function dashboard(){
 const c=state.connector||{};
 return `<div class="card">
   <h2>SWISH Seller Hub</h2>
   <p class="muted">This is the free GitHub-hosted web frontend. Your existing OnSpace SWISH backend remains the source of truth.</p>
   <div class="grid">
    <div class="card metric"><span class="muted">eBay</span><b>${esc(c.status||'Connected')}</b><span class="muted">${esc(c.seller_account_id||'Existing account')}</span></div>
    <div class="card metric"><span class="muted">Publishing</span><b>${c.can_publish?'READY':'CHECK'}</b><span class="muted">Existing eBay connector</span></div>
    <div class="card metric"><span class="muted">Inventory</span><b id="dashInv">…</b><span class="muted">Canonical items</span></div>
    <div class="card metric"><span class="muted">Last sync</span><b style="font-size:15px">${esc(c.last_sync_at?new Date(c.last_sync_at).toLocaleString():'—')}</b><span class="muted">eBay</span></div>
   </div>
 </div>
 <div class="card"><h3>Quick actions</h3><div class="toolbar">
   <button class="btn primary" onclick="go('inventory')">Open inventory</button>
   <button class="btn" onclick="syncAll()">Sync eBay</button>
   <button class="btn" onclick="imageSync()">Sync images</button>
   <button class="btn" onclick="go('scan')">Identify / Re-ID</button>
 </div><div id="dashMsg"></div></div>`;
}
function inventory(){
 return `<div class="card"><h2>Inventory</h2>
 <div class="toolbar"><input id="invq" placeholder="Search title / SKU" onkeydown="if(event.key==='Enter')loadInventory()"><button class="btn primary" onclick="loadInventory()">Search</button><button class="btn" onclick="syncAll()">eBay Sync</button></div>
 <div class="tabs">
  <button class="${state.sub==='overview'?'active':''}" onclick="state.sub='overview';loadInventory()">All</button>
  <button class="${state.sub==='needs'?'active':''}" onclick="state.sub='needs';loadInventory()">Needs review</button>
  <button class="${state.sub==='listed'?'active':''}" onclick="state.sub='listed';loadInventory()">Listed</button>
 </div>
 <div id="inv"><div class="empty">Loading inventory…</div></div></div>`;
}
async function loadInventory(){
 const box=$('#inv');if(!box)return;
 try{
  const q=($('#invq')?.value||'').trim();
  let params={select:'*',tenant_id:'eq.'+state.tenant.id,order:'updated_at.desc',limit:800};
  if(q)params.canonical_title='ilike.*'+q+'*';
  const rows=await rest('items',params);
  const filtered=rows.filter(x=>{
    const a=x.attributes||{}, ebay=a.ebay_item_id||x.external_listing_id||x.ebay_item_id;
    if(state.sub==='listed')return !!ebay || /listed|active/i.test(x.status||'');
    if(state.sub==='needs')return !x.canonical_title || !x.identification_confidence || Number(x.identification_confidence)<.65;
    return true;
  });
  const d=$('#dashInv');if(d)d.textContent=rows.length;
  box.innerHTML=filtered.length?filtered.map(itemRow).join(''):'<div class="empty">No inventory found.</div>';
 }catch(e){box.innerHTML='<div class="error">'+esc(e.message)+'</div>'}
}
function itemRow(x){
 const media=Array.isArray(x.media)?x.media:[];
 const img=media.find(u=>/^https:\/\//i.test(u));
 const a=x.attributes||{};
 const ebayId=a.ebay_item_id||x.external_listing_id||'';
 const ready=!!x.canonical_title&&media.length>0;
 return `<div class="row">
  ${img?`<img class="thumb" src="${esc(img)}" onerror="this.style.display='none'">`:'<div class="thumb"></div>'}
  <div class="grow">
   <div class="title">${esc(x.canonical_title||'Untitled item')}</div>
   <div class="muted">${esc(x.sku||x.id)} · Qty ${x.quantity??1} · ${media.length} image(s)</div>
   <div style="margin-top:5px"><span class="tag">${esc(x.condition||'condition unknown')}</span><span class="tag">${ebayId?'eBay linked':'Not linked'}</span></div>
  </div>
  <div><div class="price">${money(x.expected_selling_price||x.valuation_mid)}</div><div class="toolbar" style="margin:5px 0 0"><button class="btn" onclick="itemActions('${esc(x.id)}')">Open</button></div></div>
 </div>`;
}
async function itemActions(id){
 try{
  const item=(await rest('items',{select:'*',id:'eq.'+id,tenant_id:'eq.'+state.tenant.id,limit:1}))[0];
  if(!item)throw new Error('Item not found');
  state.selectedItem=item;
  $('#view').innerHTML=itemEditor(item);
 }catch(e){alert(e.message)}
}
function itemEditor(x){
 const a=x.attributes||{}, media=Array.isArray(x.media)?x.media:[];
 const ebayId=a.ebay_item_id||x.external_listing_id||'';
 return `<div class="card"><div class="toolbar"><button class="btn" onclick="go('inventory')">← Inventory</button></div>
 <h2>${esc(x.canonical_title||'Untitled item')}</h2>
 <p class="muted">${esc(x.sku||x.id)}</p>
 <div class="two">
  <div><h3>Images</h3><div class="three">${media.map(u=>`<img class="thumb" style="width:100%;height:110px" src="${esc(u)}">`).join('')||'<div class="empty">No stored images</div>'}</div></div>
  <div><h3>Identification</h3><p>Confidence: <b>${x.identification_confidence==null?'—':(Number(x.identification_confidence)*100).toFixed(0)+'%'}</b></p>
   <p class="muted">${esc(a.numista_status||'Numista status not recorded')}</p>
   <div class="toolbar"><button class="btn primary" onclick="reIdentify('${esc(x.id)}')">Re-ID</button><button class="btn" onclick="reValue('${esc(x.id)}')">Re-value</button><button class="btn" onclick="islamicIdentify('${esc(x.id)}')">Islamic / Countermark</button></div>
  </div>
 </div>
 <hr style="border-color:var(--line);border-width:1px 0 0;margin:16px 0">
 <div class="two"><div><b>Valuation</b><p>${money(x.valuation_low)} – ${money(x.valuation_mid)} – ${money(x.valuation_high)}</p><span class="muted">${esc(x.valuation_confidence||'not valued')}</span></div>
 <div><b>eBay</b><p>${ebayId?esc(ebayId):'Not linked'}</p><div class="toolbar"><button class="btn primary" onclick="createListing('${esc(x.id)}')">Prepare eBay listing</button>${ebayId?`<button class="btn bad" onclick="endListing('${esc(x.id)}','${esc(ebayId)}')">End listing</button>`:''}</div></div></div>
 <div id="itemMsg"></div></div>`;
}
async function reIdentify(itemId){
 const out=$('#itemMsg'); if(out)out.innerHTML='<div class="empty">Running SWISH identification engine…</div>';
 try{
  const item=(await rest('items',{select:'*',id:'eq.'+itemId,tenant_id:'eq.'+state.tenant.id,limit:1}))[0];
  const urls=(Array.isArray(item.media)?item.media:[]).filter(u=>/^https:\/\//i.test(u));
  if(!urls.length)throw new Error('This inventory item has no stored images to re-identify.');
  const d=await fn(FN.identify,{tenantId:state.tenant.id,existingImageUrls:urls,specialistId:item.specialist_id||'curiosities_collectibles',knownAttributes:item.attributes||{}});
  const ident=d.identification||{};
  const updates={
   canonical_title:ident.canonicalTitle||ident.title||item.canonical_title,
   identification_confidence:ident.confidence??item.identification_confidence,
   updated_at:new Date().toISOString()
  };
  if(ident.attributes)updates.attributes={...(item.attributes||{}),...ident.attributes};
  await rest('items',{id:'eq.'+item.id,tenant_id:'eq.'+state.tenant.id},'PATCH',updates);
  state.selectedItem={...item,...updates};
  if(out)out.innerHTML='<div class="success"><b>Re-ID complete.</b><pre>'+esc(JSON.stringify(d,null,2))+'</pre></div>';
 }catch(e){if(out)out.innerHTML='<div class="error">'+esc(e.message)+'</div>'}
}
async function islamicIdentify(itemId){
 const out=$('#itemMsg');if(out)out.innerHTML='<div class="empty">Running Islamic / countermark specialist…</div>';
 try{
  const item=(await rest('items',{select:'*',id:'eq.'+itemId,tenant_id:'eq.'+state.tenant.id,limit:1}))[0];
  const urls=(Array.isArray(item.media)?item.media:[]).filter(u=>/^https:\/\//i.test(u));
  const d=await fn(FN.islamic,{tenantId:state.tenant.id,itemId:item.id,existingImageUrls:urls,knownAttributes:item.attributes||{}});
  if(out)out.innerHTML='<div class="success"><b>Islamic identification complete.</b><pre>'+esc(JSON.stringify(d,null,2))+'</pre></div>';
 }catch(e){if(out)out.innerHTML='<div class="error">'+esc(e.message)+'</div>'}
}
async function reValue(itemId){
 const out=$('#itemMsg');if(out)out.innerHTML='<div class="empty">Running SWISH valuation engine…</div>';
 try{
  const item=(await rest('items',{select:'*',id:'eq.'+itemId,tenant_id:'eq.'+state.tenant.id,limit:1}))[0], attrs=item.attributes||{};
  const d=await fn(FN.marketValue,{tenantId:state.tenant.id,itemId:item.id,title:item.canonical_title||'Unknown item',specialistId:item.specialist_id||'curiosities_collectibles',attributes:{...attrs},condition:item.condition||'',identificationConfidence:Number(item.identification_confidence??0),identificationTier:item.identification_confidence>=.85?'high':item.identification_confidence>=.65?'medium':'low',numistaTypeId:attrs.numista_type_id?Number(attrs.numista_type_id):(attrs.numista_candidate_id?Number(attrs.numista_candidate_id):null),numistaMatchScore:Number(attrs.numista_match_score||0),numistaMatchTier:attrs.numista_status||'no_match',applyToItem:false});
  const v=d.valuation||{}, price=Number(v.recommendedListingPrice??v.valuationMid??0);
  const updates={valuation_low:Number(v.valuationLow??0),valuation_mid:Number(v.valuationMid??0),valuation_high:Number(v.valuationHigh??0),valuation_confidence:v.valuationConfidence||'insufficient_data',expected_selling_price:price,expected_net:price*.8725,expected_profit:price*.8725-Number(item.acquired_cost||0),sale_prob_30d:v.saleProb30d??null,updated_at:new Date().toISOString()};
  await rest('items',{id:'eq.'+item.id,tenant_id:'eq.'+state.tenant.id},'PATCH',updates);
  if(out)out.innerHTML='<div class="success"><b>Re-value complete.</b><p>'+money(price)+' recommended listing price</p><pre>'+esc(JSON.stringify(d,null,2))+'</pre></div>';
 }catch(e){if(out)out.innerHTML='<div class="error">'+esc(e.message)+'</div>'}
}
function listings(){
 return `<div class="card"><h2>eBay</h2><div class="tabs">
 <button class="${state.sub==='live'?'active':''}" onclick="state.sub='live';render()">Live listings</button>
 <button class="${state.sub==='draft'?'active':''}" onclick="state.sub='draft';render()">Draft / inventory</button>
 <button class="${state.sub==='messages'?'active':''}" onclick="state.sub='messages';render()">Messages</button>
 <button class="${state.sub==='returns'?'active':''}" onclick="state.sub='returns';render()">Returns</button>
 <button class="${state.sub==='cases'?'active':''}" onclick="state.sub='cases';render()">Cases</button>
 </div>${state.sub==='messages'?messagesView():state.sub==='returns'?returnsView():state.sub==='cases'?casesView():listingsView()}</div>`;
}
function listingsView(){
 return `<div class="toolbar"><button class="btn primary" onclick="loadListings()">Refresh eBay listings</button><button class="btn" onclick="syncAll()">Full eBay sync</button></div><div id="lst"><div class="empty">Loading…</div></div>`;
}
async function loadListings(){
 const box=$('#lst');if(!box)return;
 try{
  const d=await fn(FN.browse,{route:'list',tenantId:state.tenant.id});
  const rows=d?.listings||d?.items||d?.data||[];
  box.innerHTML=rows.length?rows.map(x=>`<div class="row"><div class="grow"><div class="title">${esc(x.title||x.item?.title||'Untitled')}</div><div class="muted">${esc(x.status||'eBay listing')} · ${esc(x.itemId||x.item_id||x.externalListingId||'')}</div></div><div class="price">${x.price?money(x.price):''}</div></div>`).join(''):'<div class="empty">No live listings returned.</div>';
 }catch(e){box.innerHTML='<div class="error">'+esc(e.message)+'</div>'}
}
async function createListing(itemId){
 const item=(await rest('items',{select:'*',id:'eq.'+itemId,tenant_id:'eq.'+state.tenant.id,limit:1}))[0];
 const a=item.attributes||{};
 const title=prompt('eBay title',item.canonical_title||'');
 if(title===null)return;
 const price=prompt('eBay price',String(item.expected_selling_price||item.valuation_mid||0));
 if(price===null)return;
 try{
  const d=await fn(FN.generate,{tenantId:state.tenant.id,itemId:item.id,title,price:Number(price)||0,deliveryMethod:'SIMPLE_DELIVERY'});
  const listingId=d?.listingId||d?.listing?.id||d?.id;
  if(listingId){
   await fn(FN.list,{tenantId:state.tenant.id,listingId,listingType:d.listingType||'FIXED_PRICE',categoryId:d.categoryId||a.ebay_category_id});
   alert('eBay listing submitted.');
  }else alert('Listing draft generated. '+JSON.stringify(d));
 }catch(e){alert(e.message)}
}
async function endListing(itemId,externalId){
 if(!confirm('End this eBay listing?'))return;
 try{await fn(FN.list,{route:'end',tenantId:state.tenant.id,listingId:itemId,externalListingId:externalId});alert('eBay listing ended.');render()}catch(e){alert(e.message)}
}
function orders(){return `<div class="card"><h2>Orders</h2><div class="toolbar"><button class="btn primary" onclick="syncOrders()">Sync eBay orders</button><button class="btn" onclick="loadOrders()">Refresh</button></div><div id="ord"><div class="empty">Loading…</div></div></div>`}
async function syncOrders(){try{await fn(FN.orders,{tenantId:state.tenant.id,daysBack:90});await loadOrders()}catch(e){alert(e.message)}}
async function loadOrders(){
 const box=$('#ord');if(!box)return;
 try{
  const rows=await rest('orders',{select:'*',tenant_id:'eq.'+state.tenant.id,order:'created_at.desc',limit:200});
  box.innerHTML=rows.length?rows.map(x=>`<div class="row"><div class="grow"><div class="title">${esc(x.order_id||x.external_order_id||'Order')}</div><div class="muted">${esc(x.status||'')} · ${esc(x.buyer_username||x.buyer_name||'')}</div></div><div class="price">${x.total?money(x.total):money(x.total_amount)}</div></div>`).join(''):'<div class="empty">No orders stored.</div>';
 }catch(e){box.innerHTML='<div class="error">'+esc(e.message)+'</div>'}
}
function messagesView(){return `<div class="toolbar"><button class="btn primary" onclick="syncMessages()">Sync messages</button></div><div id="msgs"><div class="empty">Loading messages…</div></div>`}
async function syncMessages(){try{await fn(FN.messages,{route:'sync_messages',tenantId:state.tenant.id,daysBack:30});const rows=await rest('ebay_messages',{select:'*',tenant_id:'eq.'+state.tenant.id,order:'created_at.desc',limit:100});$('#msgs').innerHTML=rows.length?rows.map(r=>`<div class="row"><div class="grow"><div class="title">${esc(r.subject||'eBay message')}</div><div class="muted">${esc(r.buyer_username||'')} · ${esc(r.body||r.message||'')}</div></div><button class="btn" onclick="replyMessage('${esc(r.id)}')">Reply</button></div>`).join(''):'<div class="empty">No messages.</div>'}catch(e){$('#msgs').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function replyMessage(id){const t=prompt('Reply text');if(!t)return;try{const r=(await rest('ebay_messages',{select:'*',id:'eq.'+id,tenant_id:'eq.'+state.tenant.id,limit:1}))[0];await fn(FN.messages,{route:'send_reply',tenantId:state.tenant.id,messageId:id,replyText:t,buyerUsername:r.buyer_username,ebayItemId:r.ebay_item_id,conversationId:r.conversation_id});alert('Reply sent.')}catch(e){alert(e.message)}}
function returnsView(){return `<div class="toolbar"><button class="btn primary" onclick="syncReturns()">Sync returns</button></div><div id="rets"><div class="empty">Loading…</div></div>`}
async function syncReturns(){try{await fn(FN.postOrder,{route:'sync_returns',tenantId:state.tenant.id});const rows=await rest('ebay_returns',{select:'*',tenant_id:'eq.'+state.tenant.id,order:'created_at.desc',limit:100});$('#rets').innerHTML=rows.length?rows.map(r=>`<div class="row"><div class="grow"><div class="title">${esc(r.return_id||r.external_return_id||'Return')}</div><div class="muted">${esc(r.status||'')}</div></div></div>`).join(''):'<div class="empty">No returns.</div>'}catch(e){$('#rets').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function casesView(){return `<div class="toolbar"><button class="btn primary" onclick="syncCases()">Refresh cases</button></div><div id="cases"><div class="empty">Loading…</div></div>`}
async function syncCases(){try{await fn(FN.postOrder,{route:'sync_cases',tenantId:state.tenant.id}).catch(()=>null);const rows=await rest('ebay_cases',{select:'*',tenant_id:'eq.'+state.tenant.id,order:'created_at.desc',limit:100});$('#cases').innerHTML=rows.length?rows.map(r=>`<div class="row"><div class="grow"><div class="title">${esc(r.case_id||r.external_case_id||'Case')}</div><div class="muted">${esc(r.status||'')} · ${esc(r.reason||'')}</div></div></div>`).join(''):'<div class="empty">No cases.</div>'}catch(e){$('#cases').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function scan(){
 return `<div class="card"><h2>Identify / Re-ID / Value</h2><p class="muted">Uses the existing SWISH specialist engines and existing stored inventory images.</p>
 <input id="scanId" placeholder="Existing SWISH item ID">
 <div class="toolbar" style="margin-top:10px"><button class="btn primary" onclick="runEngine(FN.identify)">Analyse / Re-ID</button><button class="btn" onclick="runEngine(FN.islamic)">Islamic / Countermark</button><button class="btn" onclick="runEngine(FN.marketValue)">Re-value</button></div>
 <div id="scanOut"></div></div>`;
}
async function runEngine(name){
 const out=$('#scanOut'),id=$('#scanId')?.value.trim();
 if(!id){out.innerHTML='<div class="error">Enter an existing SWISH item ID.</div>';return}
 out.innerHTML='<div class="empty">Running engine…</div>';
 try{
  const item=(await rest('items',{select:'*',id:'eq.'+id,tenant_id:'eq.'+state.tenant.id,limit:1}))[0];
  if(!item)throw new Error('Item not found');
  const urls=(Array.isArray(item.media)?item.media:[]).filter(u=>/^https:\/\//i.test(u));
  let d;
  if(name===FN.identify)d=await fn(name,{tenantId:state.tenant.id,existingImageUrls:urls,specialistId:item.specialist_id||'curiosities_collectibles',knownAttributes:item.attributes||{}});
  else if(name===FN.islamic)d=await fn(name,{tenantId:state.tenant.id,itemId:item.id,existingImageUrls:urls,knownAttributes:item.attributes||{}});
  else d=await fn(name,{tenantId:state.tenant.id,itemId:item.id,title:item.canonical_title||'Unknown item',specialistId:item.specialist_id||'curiosities_collectibles',attributes:item.attributes||{},condition:item.condition||'',identificationConfidence:Number(item.identification_confidence??0),identificationTier:item.identification_confidence>=.85?'high':item.identification_confidence>=.65?'medium':'low',numistaTypeId:item.attributes?.numista_type_id?Number(item.attributes.numista_type_id):null,numistaMatchScore:Number(item.attributes?.numista_match_score||0),numistaMatchTier:item.attributes?.numista_status||'no_match',applyToItem:false});
  out.innerHTML='<div class="success"><b>Engine complete</b><pre>'+esc(JSON.stringify(d,null,2))+'</pre></div>';
 }catch(e){out.innerHTML='<div class="error">'+esc(e.message)+'</div>'}
}
function more(){
 return `<div class="card"><h2>SWISH tools</h2><div class="grid">
 <button class="btn" onclick="state.page='listings';state.sub='live';render()">eBay Listings</button>
 <button class="btn" onclick="state.page='listings';state.sub='messages';render()">Messages</button>
 <button class="btn" onclick="state.page='listings';state.sub='returns';render()">Returns</button>
 <button class="btn" onclick="state.page='listings';state.sub='cases';render()">Cases</button>
 <button class="btn" onclick="syncAll()">Full eBay Sync</button>
 <button class="btn" onclick="imageSync()">Image Sync</button>
 <button class="btn" onclick="go('scan')">Identification</button>
 <button class="btn bad" onclick="logout()">Sign out</button>
 </div></div>`;
}
async function syncAll(){
 const el=$('#dashMsg');if(el)el.innerHTML='<div class="empty">Running full SWISH eBay sync…</div>';
 try{const d=await fn(FN.sync,{tenantId:state.tenant.id,mode:'full'});state.connector=await rest('marketplace_connectors',{select:'*',tenant_id:'eq.'+state.tenant.id,marketplace_id:'eq.ebay',limit:1}).then(x=>x?.[0]||state.connector);if(el)el.innerHTML='<div class="success">Full eBay sync complete.<pre>'+esc(JSON.stringify(d,null,2))+'</pre></div>';else alert('Sync complete.');render()}catch(e){if(el)el.innerHTML='<div class="error">'+esc(e.message)+'</div>';else alert(e.message)}}
async function imageSync(){try{const d=await fn(FN.image,{tenantId:state.tenant.id,mode:'all'});alert('Image sync complete.');return d}catch(e){alert(e.message)}}
function logout(){localStorage.removeItem('swish_access_token');localStorage.removeItem('swish_refresh_token');state.token='';state.refresh='';bootstrap()}
async function bootstrap(){
 try{await loadTenant();setStatus(true,(state.connector?.status||'Connected')+' · eBay');render()}catch(e){
  setStatus(false,'Sign in required');
  $('#view').innerHTML=`<div class="card"><h2>SWISH Sign in</h2><p class="muted">The frontend is hosted on GitHub. Authentication remains with the existing SWISH backend.</p><div class="two"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"></div><div class="toolbar" style="margin-top:10px"><button class="btn primary" onclick="doLogin()">Sign in</button></div><div id="loginError"></div></div>`;
 }
}
async function doLogin(){try{await signIn($('#email').value,$('#password').value)}catch(e){$('#loginError').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
bootstrap();
</script>
</body>
</html>

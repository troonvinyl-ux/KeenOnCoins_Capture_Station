<style>
:root{

  --red:#ff6573;

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;

button,input,textarea,select{

.g4{

.g3{

.g2{

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function money(value){

  return new Intl.NumberFormat(
    "en-GB",
    {
      style:"currency",
      currency:"GBP"
    }
  ).format(Number(value)||0);
}

    </button>
  `;
}

function showToast(message){

  let el=document.getElementById("toast");

  if(!el){

    el=document.createElement("div");

    el.id="toast";

    document.body.appendChild(el);

  }

  el.textContent=message;

  clearTimeout(toastTimer);

  toastTimer=setTimeout(function(){

    if(el) el.remove();

  },3000);
}

/*
===========================================================
BACKEND
===========================================================
*/

async function backendTable(table){

  const url=
    SUPABASE_URL.replace(/\/$/,"")+
    "/rest/v1/"+
    table+
    "?select=*&limit=100";

  const response=
    await fetch(
      url,
      {
        headers:{
          "apikey":SUPABASE_ANON_KEY,
          "Authorization":"Bearer "+SUPABASE_ANON_KEY
        }
      }
    );

  if(!response.ok){

    throw new Error(
      "Backend returned HTTP "+response.status
    );

  }

  return await response.json();

}

async function edgeFunction(name,payload={}){

  const url=
    SUPABASE_URL.replace(/\/$/,"")+
    "/functions/v1/"+
    name;

  const response=
    await fetch(
      url,
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json",
          "apikey":SUPABASE_ANON_KEY,
          "Authorization":"Bearer "+SUPABASE_ANON_KEY
        },

        body:JSON.stringify(payload)
      }
    );

  const text=await response.text();

  let data=text;

  try{
    data=JSON.parse(text);
  }catch(e){}

  if(!response.ok){

    throw new Error(
      typeof data==="string"
      ?data
      :(data?.message || "Edge Function failed")
    );

  }

  return data;

}

function tableScreen(title,table,columns){

  setTimeout(
    function(){
      loadTable(table,columns);
    },
    0
  );

  return `

    ${top(
      title,
      "Live SWISH backend data.",
      button("Refresh","render()")
    )}

    <div class="card">

      <div id="tableData">

        <div class="empty">
          Loading ${escapeHTML(title)}…
        </div>

      </div>

    </div>

  `;

}

async function loadTable(table,columns){

  const element=
    document.getElementById("tableData");

  if(!element) return;

  try{

    const rows=
      await backendTable(table);

    if(!rows.length){

      element.innerHTML=`
        <div class="empty">
          No records returned.
        </div>
      `;

      return;

    }

    element.innerHTML=`

      <table class="table">

        <thead>

          <tr>

            ${columns.map(function(column){

              return `
                <th>
                  ${escapeHTML(column)}
                </th>
              `;

            }).join("")}

          </tr>

        </thead>

        <tbody>

          ${rows.map(function(row){

            return `

              <tr>

                ${columns.map(function(column){

                  return `
                    <td>
                      ${escapeHTML(row[column])}
                    </td>
                  `;

                }).join("")}

              </tr>

            `;

          }).join("")}

        </tbody>

      </table>

    `;

  }catch(error){

    element.innerHTML=`

      <div class="banner bad">

        ${escapeHTML(
          error.message ||
          "Unable to load backend data."
        )}

      </div>

    `;

  }

}

function previewCoin(input,target){

  const url=
    URL.createObjectURL(file);

  document.getElementById(target).innerHTML=`

    <img
      class="coin-preview"
      src="${url}">

  `;

}

async function runDecomposition(){

  const instruction=
    document.getElementById(
      "decompositionInstruction"
    )?.value || "";

  const result=
    document.getElementById(
      "decompositionResult"
    );

  result.innerHTML=`

    <div class="empty">

      Parsing instruction and calling SWISH browse engine…

    </div>

  `;

  try{

    const data=
      await edgeFunction(
        "swish-ebay-browse",
        {
          instruction:instruction,
          query:instruction,
          mode:"opportunity_search"
        }
      );

    result.innerHTML=`

      <h2>
        Search Response
      </h2>

      <pre
        style="white-space:pre-wrap;overflow:auto;max-height:400px"
      >${escapeHTML(
        JSON.stringify(
          data,
          null,
          2
        )
      )}</pre>

    `;

  }catch(error){

    const keywords=
      instruction.match(
        /obol|stater|litra|dirham|drachm|tetradrachm|joblot|collection|silver|gold/gi
      ) || [];

    const unique=
      [...new Set(
        keywords.map(
          x=>x.toLowerCase()
        )
      )];

    result.innerHTML=`

      <h2>
        Decomposition Plan
      </h2>

      <div class="grid g3">

        <div>
          <div class="label">
            Detected keywords
          </div>

          <b>
            ${escapeHTML(
              unique.join(", ") ||
              "User supplied terms"
            )}
          </b>

        </div>

        <div>
          <div class="label">
            Geography
          </div>

          <b>
            ${escapeHTML(
              document.getElementById(
                "geo"
              )?.value
            )}
          </b>

        </div>

        <div>
          <div class="label">
            Ending window
          </div>

          <b>
            ${escapeHTML(
              document.getElementById(
                "endingWindow"
              )?.value
            )}
          </b>

        </div>

      </div>

      <div class="banner bad">

        The existing browse function did not accept
        this instruction:

        ${escapeHTML(
          error.message
        )}

      </div>

      <div class="notice">

        <b>
          Planned intelligence pipeline:
        </b>

        search →

        candidate lots →

        component decomposition →

        identification →

        evidence-backed valuation →

        fees →

        risk →

        opportunity calculation →

        human approval

      </div>

    `;

  }

}

function showModal(content){

  const existing=
    document.getElementById(
      "modal"
    );

  if(existing)
    existing.remove();

  const modal=
    document.createElement(
      "div"
    );

  modal.id="modal";

  modal.className="modal";

  modal.innerHTML=`

    <div class="modal-box">

      ${content}

    </div>

  `;

  document.body.appendChild(
    modal
  );

}

function closeModal(){

  const modal=
    document.getElementById(
      "modal"
    );

  if(modal)
    modal.remove();

}

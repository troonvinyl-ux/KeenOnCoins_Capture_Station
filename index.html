<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111">
  <title>KeenOnCoins — Silver Capture Station</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header>
      <div>
        <div class="eyebrow">KEENONCOINS</div>
        <h1>Silver Capture Station</h1>
        <p>Capture → identify → value → save to SWISH</p>
      </div>
      <button id="swishConnect" class="status" type="button">Connect SWISH</button>
    </header>
    <section class="camera-card">
      <div class="camera-wrap">
        <video id="camera" autoplay playsinline muted></video>
        <div class="guide"></div>
        <div id="cameraMessage" class="camera-message">Camera not started</div>
      </div>
      <div class="camera-controls">
        <button id="startCamera" class="primary">Start camera</button>
        <button id="capture" disabled>Capture <span id="sideLabel">OBVERSE</span></button>
        <label class="upload">Photo<input id="photoInput" type="file" accept="image/*" capture="environment"></label>
      </div>
      <canvas id="canvas" hidden></canvas>
      <div class="shots">
        <div><span>Obverse</span><img id="obversePreview" alt=""></div>
        <div><span>Reverse</span><img id="reversePreview" alt=""></div>
      </div>
      <button id="nextSide" disabled>Switch to reverse</button>
    </section>
    <section class="details">
      <h2>Coin details</h2>
      <div class="grid">
        <label>Weight (g)<input id="weight" inputmode="decimal" placeholder="e.g. 7.78"></label>
        <label>Diameter (mm)<input id="diameter" inputmode="decimal" placeholder="e.g. 23"></label>
        <label>Metal<select id="metal"><option>Silver</option><option>Billon</option><option>Gold</option><option>Copper</option><option>Bronze</option><option>Unknown</option></select></label>
        <label>Notes<textarea id="notes" rows="3" placeholder="Visible lettering, countermarks, ruler notes, etc."></textarea></label>
      </div>
    </section>
    <section class="actions">
      <button id="identify" class="primary" disabled>Identify coin</button>
      <button id="value" disabled>Conservative quick-sale value</button>
      <button id="save" disabled>Save to SWISH</button>
    </section>
    <section id="result" class="result hidden"><h2>Assessment</h2><div id="resultBody"></div></section>
    <section class="local-note"><strong>SWISH-connected build</strong><p>Uses the existing SWISH OnSpace/Supabase backend. No second database is created.</p></section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>MyGab TV</title>
<style>
:root{color-scheme:dark;--bg:#080a10;--panel:#141827;--muted:#aab2c4;--accent:#9875ff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:Arial,sans-serif}button,input,textarea{font:inherit}button{background:#252b3c;border:1px solid #414963;border-radius:10px;padding:12px 16px;color:white;cursor:pointer}button:focus,input:focus,textarea:focus{outline:3px solid #bba7ff;outline-offset:2px}.primary{background:var(--accent);border-color:var(--accent)}header{height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #252b3a}.brand{font-weight:900;font-size:24px}.brand span{color:#ba9fff}.muted{color:var(--muted)}main{height:calc(100% - 64px);position:relative}.feed{height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#25213c,#090b12 65%)}.player{width:min(65vw,520px);height:calc(100% - 28px);max-height:850px;position:relative;border-radius:16px;overflow:hidden;background:#000;border:1px solid #31374a;box-shadow:0 15px 70px #0009}.player iframe,.player video{width:100%;height:100%;border:0;object-fit:contain;background:#000}.overlay{position:absolute;bottom:0;left:0;right:0;padding:48px 18px 18px;background:linear-gradient(transparent,#000d);pointer-events:none}.overlay>*{margin:5px 0}.overlay a{pointer-events:auto;color:#d8cbff}.controls{position:absolute;right:20px;bottom:30px;display:flex;flex-direction:column;gap:12px}.controls button{min-width:58px;min-height:54px;font-size:20px}.feedbar{position:absolute;top:16px;left:20px;display:flex;gap:8px;align-items:center}.notice{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);max-width:80%;text-align:center;color:var(--muted)}.modal{position:absolute;inset:0;background:#05060bed;display:flex;align-items:center;justify-content:center;padding:22px;z-index:5}.card{width:min(720px,96vw);max-height:92%;overflow:auto;background:var(--panel);border:1px solid #333b51;border-radius:18px;padding:24px}.card h2{margin-top:0}.field{display:grid;gap:8px;margin:14px 0}.field input,.field textarea{width:100%;background:#090c14;border:1px solid #3c455e;border-radius:9px;color:#fff;padding:12px}.field textarea{min-height:90px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.small{font-size:13px;line-height:1.5}.hidden{display:none!important}.feedlist{display:grid;gap:8px}.feeditem{padding:12px;border:1px solid #353c50;border-radius:10px;display:flex;justify-content:space-between;gap:12px}a{color:#cbbaff}
@media(max-width:700px){.player{width:88vw;height:calc(100% - 24px)}.controls{right:10px;bottom:18px}.feedbar{left:10px;top:10px}header{padding:0 12px}}
</style></head><body>
<header><div class="brand">MyGab<span> TV</span></div><div class="row" style="flex:initial;align-items:center"><span class="muted" id="count">Demo feed</span><button id="adminOpen">Admin 🔒</button></div></header>
<main><section class="feed" id="feed"><div class="feedbar"><button id="prev">◀ Previous</button><button id="next" class="primary">Next ▶</button></div><div class="player" id="player"><div class="notice" id="placeholder">Welcome to MyGab TV<br><br>Open Admin to add search keywords and sources, or load the demonstration feed.</div></div><div class="controls"><button id="up" title="Previous">▲</button><button id="down" title="Next">▼</button><button id="openSource" title="Open source">↗</button></div></section>
<div id="modal" class="modal hidden"><div class="card" id="modalCard"></div></div></main>
<script>
const $=id=>document.getElementById(id);
const KEY='mygab-tv-config-v1';
const defaults={keywords:['nature shorts','travel short videos','science facts shorts'],sources:[],items:[
{title:'Big Buck Bunny — sample video',url:'https://www.youtube.com/watch?v=aqz-KE-bpKQ',embed:'https://www.youtube-nocookie.com/embed/aqz-KE-bpKQ?autoplay=1&mute=0&rel=0'},
{title:'Sintel — sample video',url:'https://www.youtube.com/watch?v=について',embed:'https://www.youtube-nocookie.com/embed/2eMtWfG0l6w?autoplay=1&rel=0'},
{title:'Elephants Dream — sample video',url:'https://www.youtube.com/watch?v=TLkA0_REL0s',embed:'https://www.youtube-nocookie.com/embed/TLkA0_REL0s?autoplay=1&rel=0'}
]};
let config;try{config=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch(e){config=JSON.parse(JSON.stringify(defaults))}
let index=0,feedItems=[];const save=()=>localStorage.setItem(KEY,JSON.stringify(config));
function normalise(){feedItems=[...(config.items||[])];}
function render(){if(!feedItems.length){$('player').innerHTML='<div class="notice">No videos in feed yet.<br><br>Open Admin to configure keywords and add video links.</div>';$('count').textContent='0 videos';return}
index=(index+feedItems.length)%feedItems.length;const item=feedItems[index];$('player').innerHTML='<iframe allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" src="'+esc(item.embed||item.url)+'" title="'+esc(item.title)+'"></iframe><div class="overlay"><strong>'+esc(item.title)+'</strong><div class="small muted">'+(item.keyword?'Found for: '+esc(item.keyword):'Video source')+'</div><a href="'+esc(item.url)+'" target="_blank" rel="noopener">Open original video ↗</a></div>';$('count').textContent=(index+1)+' / '+feedItems.length}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function move(delta){if(!feedItems.length)return;index=(index+delta+feedItems.length)%feedItems.length;render()}
$('prev').onclick=$('up').onclick=()=>move(-1);$('next').onclick=$('down').onclick=()=>move(1);$('openSource').onclick=()=>{if(feedItems[index])window.open(feedItems[index].url,'_blank','noopener')};
document.addEventListener('keydown',e=>{if(!$('modal').classList.contains('hidden')){if(e.key==='Escape')closeModal();return}if(['ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();move(1)}if(['ArrowUp','PageUp'].includes(e.key)){e.preventDefault();move(-1)}if(e.key==='Enter'){e.preventDefault();move(1)}if(e.key.toLowerCase()==='a')admin()} );
function showModal(html){$('modalCard').innerHTML=html;$('modal').classList.remove('hidden');const f=$('modalCard').querySelector('input,button');if(f)f.focus()}
function closeModal(){$('modal').classList.add('hidden')}
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
function admin(){showModal('<h2>Admin PIN</h2><p class="muted">Enter your PIN to edit discovery settings and the video feed.</p><form id="pinForm"><div class="field"><label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" autofocus></div><div class="row"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Unlock</button></div><p class="small muted">PIN protection in this standalone prototype is local to this browser. For a public hosted deployment, move admin authentication and settings to a server.</p></form>');$('cancel').onclick=closeModal;$('pinForm').onsubmit=e=>{e.preventDefault();if($('pin').value==='1802')adminPanel();else{$('pin').value='';alert('Incorrect PIN')}}}
$('adminOpen').onclick=admin;
function adminPanel(){showModal('<h2>MyGab TV · Admin</h2><p class="muted small">Configure what to search for and manage links in the feed. Settings save in this browser.</p><div class="field"><label for="keywords">Search keywords (one per line)</label><textarea id="keywords">'+esc((config.keywords||[]).join('\n'))+'</textarea></div><div class="field"><label for="sources">Preferred source domains / notes (one per line)</label><textarea id="sources" placeholder="youtube.com&#10;vimeo.com">'+esc((config.sources||[]).join('\n'))+'</textarea></div><h3>Add a video</h3><div class="field"><label for="title">Title</label><input id="title" placeholder="Video title"></div><div class="field"><label for="url">Original video URL</label><input id="url" placeholder="https://www.youtube.com/watch?v=..."></div><div class="field"><label for="embed">Embed URL (optional; YouTube/Vimeo embed link)</label><input id="embed" placeholder="https://www.youtube-nocookie.com/embed/VIDEO_ID"></div><div class="row"><button id="addVideo" class="primary">Add video</button><button id="saveConfig">Save settings</button><button id="resetDemo">Reset demo feed</button></div><h3>Feed videos</h3><div class="feedlist" id="feedlist"></div><p class="small muted">Keyword discovery UI is ready, but automated internet-wide search is not active until a server-side search provider/API is configured. This avoids broken or unauthorised scraping and lets Fire Stick playback use each source’s supported player.</p><div class="row"><button id="closeAdmin">Done</button></div>');
const drawList=()=>{$('feedlist').innerHTML=(config.items||[]).map((it,i)=>'<div class="feeditem"><div><strong>'+esc(it.title)+'</strong><div class="small muted">'+esc(it.url)+'</div></div><button data-remove="'+i+'">Remove</button></div>').join('')||'<p class="muted">No added videos.</p>';document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{config.items.splice(+b.dataset.remove,1);save();drawList();normalise();render()})};
$('saveConfig').onclick=()=>{config.keywords=$('keywords').value.split('\n').map(s=>s.trim()).filter(Boolean);config.sources=$('sources').value.split('\n').map(s=>s.trim()).filter(Boolean);save();alert('Settings saved');};
$('addVideo').onclick=()=>{const url=$('url').value.trim(),title=$('title').value.trim()||url,embed=$('embed').value.trim()||url;if(!/^https?:\/\//i.test(url)||!/^https?:\/\//i.test(embed)){alert('Enter valid http(s) video and embed URLs.');return}config.items=config.items||[];config.items.push({title,url,embed});save();normalise();drawList();render();$('title').value=$('url').value=$('embed').value='';};
$('resetDemo').onclick=()=>{config.items=JSON.parse(JSON.stringify(defaults.items));save();normalise();drawList();render()};
$('closeAdmin').onclick=()=>{closeModal();normalise();render()};drawList()}
normalise();render();
</script></body></html>
